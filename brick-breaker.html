<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Prism Brick Breaker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      overflow: hidden;
      touch-action: none;
    }
    .hud {
      width: min(480px, 95vw);
      display: flex;
      justify-content: space-between;
      background: #131520;
      border: 1px solid #25293d;
      border-radius: 12px;
      padding: 9px 16px;
      font-weight: 800;
      font-size: 0.9rem;
    }
    .hud .score { color: #38bdf8; }
    .hud .stage { color: #a78bfa; }
    .hud .lives { color: #f43f5e; }
    .stage-wrap {
      position: relative;
      width: min(480px, 95vw);
      aspect-ratio: 4 / 3;
      background: #0b0e19;
      border: 2px solid #25293d;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
      touch-action: none;
    }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.86);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }
    .overlay.visible { display: flex; }
    .btn {
      background: linear-gradient(135deg, #6842ff, #ea580c);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 22px;
      font-weight: 800;
      cursor: pointer;
    }
    .mobile-pad {
      display: none;
      width: min(480px, 95vw);
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .m-btn {
      background: #1a1d2d;
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      touch-action: none;
    }
    .m-btn:active { background: #6842ff; }
    @media (hover: none) and (pointer: coarse) {
      .mobile-pad { display: grid; }
    }
    .hint { font-size: 0.78rem; color: #9aa0b8; text-align: center; }
  </style>
</head>
<body>
  <div class="hud">
    <span class="score">SCORE: <b id="scoreVal">0</b></span>
    <span class="stage">STAGE: <b id="stageVal">1</b></span>
    <span class="lives">BALLS: <b id="livesVal">3</b></span>
  </div>
  <div class="stage-wrap">
    <canvas id="brkCanvas" width="480" height="360"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle" style="font-size:1.55rem; color:#fb923c;">PRISM BREAKER</h2>
      <p id="ovSub" style="color:#9aa0b8; font-size:0.88rem;">Random brick layouts every stage! Drag/tap on screen or use buttons/arrows.</p>
      <button class="btn" id="startBtn">Launch Orb</button>
    </div>
  </div>
  <div class="mobile-pad">
    <button type="button" class="m-btn" id="mobLeft">◀ MOVE LEFT</button>
    <button type="button" class="m-btn" id="mobRight">MOVE RIGHT ▶</button>
  </div>
  <div class="hint">Drag / Touch / Mouse / Arrows or A/D to steer paddle</div>

  <script>
    const canvas = document.getElementById('brkCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreVal');
    const stageEl = document.getElementById('stageVal');
    const livesEl = document.getElementById('livesVal');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');
    const ovSub = document.getElementById('ovSub');
    const startBtn = document.getElementById('startBtn');

    const COLORS = ['#f43f5e', '#fb923c', '#facc15', '#34d399', '#38bdf8', '#a855f7'];
    let paddle = { x: 240, y: 332, w: 88, h: 13 };
    let ball = { x: 240, y: 312, r: 7, vx: 3.4, vy: -3.8 };
    let bricks = [];
    let score = 0, lives = 3, stage = 1, running = false;
    let keys = {};
    let touchTargetX = null;

    function buildRandomBricks(lvl) {
      bricks = [];
      const rows = Math.min(7, 4 + Math.floor(lvl / 2));
      const cols = 8;
      const pad = 6;
      const bw = (480 - pad * (cols + 1)) / cols;
      const bh = 18;
      const patternMode = lvl % 3; // 0: scattered gaps, 1: checker/wave, 2: dense cluster

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let spawn = true;
          if (patternMode === 0) spawn = Math.random() > 0.26;
          else if (patternMode === 1) spawn = ((r + c) % 2 === 0) || Math.random() > 0.45;
          else spawn = Math.random() > 0.14;

          if (!spawn) continue;
          const isArmored = (lvl >= 2 && r === 0) || (lvl >= 3 && Math.random() < 0.22);
          const hp = isArmored ? 2 : 1;
          bricks.push({
            x: pad + c * (bw + pad),
            y: 34 + r * (bh + pad),
            w: bw,
            h: bh,
            hp,
            color: hp > 1 ? '#e2e8f0' : COLORS[(r + c) % COLORS.length]
          });
        }
      }

      // Guarantee at least 12 random bricks on a stage
      if (bricks.length < 12) {
        for (let k = 0; k < 12; k++) {
          const c = k % cols;
          const r = Math.floor(k / cols);
          bricks.push({
            x: pad + c * (bw + pad),
            y: 34 + r * (bh + pad),
            w: bw,
            h: bh,
            hp: 1,
            color: COLORS[k % COLORS.length]
          });
        }
      }
    }

    function resetBall() {
      paddle.x = 240;
      touchTargetX = null;
      ball.x = 240;
      ball.y = paddle.y - ball.r - 2;
      const spd = 3.8 + (stage - 1) * 0.32;
      const angle = -Math.PI / 2 + (Math.random() * 0.5 - 0.25);
      ball.vx = Math.cos(angle) * spd;
      ball.vy = Math.sin(angle) * spd;
    }

    function startNew() {
      score = 0; lives = 3; stage = 1;
      buildRandomBricks(stage);
      resetBall();
      running = true;
      overlay.classList.add('hidden');
      syncHud();
    }

    function syncHud() {
      scoreEl.textContent = score;
      stageEl.textContent = stage;
      livesEl.textContent = lives;
    }

    window.addEventListener('keydown', e => {
      if (['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code)) e.preventDefault();
      keys[e.code] = true;
      touchTargetX = null;
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function updatePointerPaddle(clientX) {
      const rect = canvas.getBoundingClientRect();
      if (!rect.width) return;
      const relX = ((clientX - rect.left) / rect.width) * canvas.width;
      touchTargetX = Math.max(paddle.w / 2, Math.min(canvas.width - paddle.w / 2, relX));
    }

    canvas.addEventListener('pointerdown', e => {
      if (!running) return;
      e.preventDefault();
      updatePointerPaddle(e.clientX);
    });
    canvas.addEventListener('pointermove', e => {
      if (!running) return;
      if (e.pointerType === 'mouse' || e.buttons > 0) {
        updatePointerPaddle(e.clientX);
      }
    });
    canvas.addEventListener('touchstart', e => {
      if (!running || !e.touches[0]) return;
      e.preventDefault();
      updatePointerPaddle(e.touches[0].clientX);
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      if (!running || !e.touches[0]) return;
      e.preventDefault();
      updatePointerPaddle(e.touches[0].clientX);
    }, { passive: false });

    function bindMobileBtn(id, code) {
      const btn = document.getElementById(id);
      if (!btn) return;
      const on = e => { e.preventDefault(); touchTargetX = null; keys[code] = true; };
      const off = e => { e.preventDefault(); keys[code] = false; };
      btn.addEventListener('pointerdown', on);
      btn.addEventListener('pointerup', off);
      btn.addEventListener('pointerleave', off);
      btn.addEventListener('pointercancel', off);
    }
    bindMobileBtn('mobLeft', 'ArrowLeft');
    bindMobileBtn('mobRight', 'ArrowRight');

    function update() {
      if (!running) return;

      if (keys['ArrowLeft'] || keys['KeyA']) paddle.x -= 6.8;
      if (keys['ArrowRight'] || keys['KeyD']) paddle.x += 6.8;
      if (touchTargetX !== null) {
        paddle.x += (touchTargetX - paddle.x) * 0.28;
      }
      paddle.x = Math.max(paddle.w / 2, Math.min(canvas.width - paddle.w / 2, paddle.x));

      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
      if (ball.x + ball.r > canvas.width) { ball.x = canvas.width - ball.r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

      if (
        ball.vy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        Math.abs(ball.x - paddle.x) <= paddle.w / 2 + ball.r
      ) {
        const offset = (ball.x - paddle.x) / (paddle.w / 2);
        const speed = Math.hypot(ball.vx, ball.vy) * 1.015;
        const bounceAngle = offset * 1.05;
        ball.vx = Math.sin(bounceAngle) * speed;
        ball.vy = -Math.abs(Math.cos(bounceAngle) * speed);
      }

      for (let i = bricks.length - 1; i >= 0; i--) {
        const b = bricks[i];
        if (
          ball.x + ball.r > b.x &&
          ball.x - ball.r < b.x + b.w &&
          ball.y + ball.r > b.y &&
          ball.y - ball.r < b.y + b.h
        ) {
          bricks[i].hp--;
          if (bricks[i].hp <= 0) {
            bricks.splice(i, 1);
            score += 20 * stage;
          } else {
            score += 10;
            bricks[i].color = COLORS[i % COLORS.length];
          }
          ball.vy = -ball.vy;
          syncHud();
          break;
        }
      }

      if (bricks.length === 0) {
        stage++;
        score += 150;
        buildRandomBricks(stage);
        resetBall();
        syncHud();
      }

      if (ball.y - ball.r > canvas.height) {
        lives--;
        syncHud();
        if (lives <= 0) {
          running = false;
          ovTitle.textContent = 'GAME OVER';
          ovSub.textContent = `Final Score: ${score} · Reached Stage ${stage}`;
          startBtn.textContent = 'Play Again';
          overlay.classList.remove('hidden');
        } else {
          resetBall();
        }
      }
    }

    function render() {
      ctx.fillStyle = '#0b0e19';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      bricks.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 4);
        ctx.fill();
        if (b.hp > 1) {
          ctx.strokeStyle = 'rgba(255,255,255,0.55)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(b.x + 1.5, b.y + 1.5, b.w - 3, b.h - 3);
        }
      });

      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();

      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    startBtn.addEventListener('click', startNew);
    loop();
  </script>
</body>
</html>
