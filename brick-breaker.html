<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Prism Brick Breaker · Power-Ups &amp; Power-Downs</title>
  <style>
    :root {
      --bg: #080b14;
      --panel: #131726;
      --border: #252d48;
      --cyan: #38bdf8;
      --purple: #a855f7;
      --emerald: #34d399;
      --amber: #fbbf24;
      --rose: #f43f5e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #121830 0%, var(--bg) 75%);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 10px;
      touch-action: none;
    }

    .hud {
      width: min(520px, 96vw);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      padding-right: 46px;
      font-weight: 800;
      font-size: 0.86rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .hud .score { color: var(--cyan); }
    .hud .stage { color: var(--purple); }
    .hud .lives { color: var(--rose); }

    .effects-strip {
      width: min(520px, 96vw);
      min-height: 22px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }
    .fx-pill {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(19, 23, 38, 0.9);
      border: 1px solid var(--border);
    }
    .fx-pill.good { border-color: var(--emerald); color: var(--emerald); }
    .fx-pill.bad  { border-color: var(--rose); color: #fda4af; }

    .stage-wrap {
      position: relative;
      width: min(520px, 96vw);
      aspect-ratio: 4 / 3;
      max-height: 58dvh;
      background: #090d1a;
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 11, 20, 0.88);
      backdrop-filter: blur(5px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 18px;
      z-index: 10;
    }
    .overlay.visible { display: flex; }
    .overlay h2 { font-size: 1.55rem; color: #fb923c; font-weight: 900; }
    .overlay p  { font-size: 0.84rem; color: #cbd5e1; max-width: 360px; line-height: 1.45; }

    .btn {
      background: linear-gradient(135deg, #6842ff, #ea580c);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 24px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(104, 66, 255, 0.35);
    }

    /* Mobile & Touch Controls */
    .mobile-controls {
      width: min(520px, 96vw);
      display: grid;
      grid-template-columns: 1fr 1fr 0.9fr;
      gap: 8px;
      touch-action: none;
    }
    .ctrl-btn {
      background: #161b2e;
      border: 1.5px solid #303a5e;
      color: #f8fafc;
      border-radius: 10px;
      padding: 12px 8px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 900;
      cursor: pointer;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .ctrl-btn:active, .ctrl-btn.pressed {
      background: #6842ff;
      border-color: #a78bfa;
      color: #fff;
      transform: scale(0.97);
    }
    .ctrl-btn.laser-btn {
      background: rgba(234, 88, 12, 0.22);
      border-color: #fb923c;
      color: #fed7aa;
    }
    .ctrl-btn.laser-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .legend {
      width: min(520px, 96vw);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 12px;
      font-size: 0.68rem;
      color: var(--muted);
    }
    .legend b.g { color: var(--emerald); }
    .legend b.b { color: var(--rose); }
  </style>
</head>
<body>
  <div class="hud">
    <span class="score">SCORE: <b id="scoreVal">0</b></span>
    <span class="stage">STAGE: <b id="stageVal">1</b></span>
    <span class="lives">BALLS: <b id="livesVal">3</b></span>
  </div>

  <div class="effects-strip" id="effectsStrip"></div>

  <div class="stage-wrap" id="stageWrap">
    <canvas id="brkCanvas" width="480" height="360"></canvas>
    <div class="overlay visible" id="overlay">
      <h2 id="ovTitle">PRISM BREAKER</h2>
      <p id="ovSub">Procedural stages, Power-Ups (Multi-Ball, Wide Paddle, Magnet, Laser) &amp; Power-Downs (Shrink, Fast Ball, Reverse)!</p>
      <button type="button" class="btn" id="startBtn">LAUNCH STAGE</button>
    </div>
  </div>

  <div class="mobile-controls" id="mobileControls">
    <button type="button" class="ctrl-btn" id="btnLeft">◄ LEFT</button>
    <button type="button" class="ctrl-btn" id="btnRight">RIGHT ►</button>
    <button type="button" class="ctrl-btn laser-btn" id="btnLaser" disabled>⚡ LASER (0)</button>
  </div>

  <div class="legend">
    <span><b class="g">[W]</b> Wide Paddle</span>
    <span><b class="g">[M]</b> Multi-Ball</span>
    <span><b class="g">[G]</b> Ball Magnet</span>
    <span><b class="g">[L]</b> Laser Shots</span>
    <span><b class="b">[S]</b> Shrink Paddle</span>
    <span><b class="b">[T]</b> Turbo Ball</span>
    <span><b class="b">[R]</b> Reverse Controls</span>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('brkCanvas');
      const ctx = canvas.getContext('2d');
      const stageWrap = document.getElementById('stageWrap');
      const scoreEl = document.getElementById('scoreVal');
      const stageEl = document.getElementById('stageVal');
      const livesEl = document.getElementById('livesVal');
      const effectsStrip = document.getElementById('effectsStrip');
      const overlay = document.getElementById('overlay');
      const ovTitle = document.getElementById('ovTitle');
      const ovSub = document.getElementById('ovSub');
      const startBtn = document.getElementById('startBtn');
      const btnLeft = document.getElementById('btnLeft');
      const btnRight = document.getElementById('btnRight');
      const btnLaser = document.getElementById('btnLaser');

      const COLORS = ['#f43f5e', '#fb923c', '#facc15', '#34d399', '#38bdf8', '#a855f7'];
      const W = 480;
      const H = 360;

      const BASE_PADDLE_W = 88;
      const MIN_PADDLE_W = 54;
      const MAX_PADDLE_W = 136;

      let paddle = { x: W / 2, y: 332, w: BASE_PADDLE_W, h: 13 };
      let balls = [];
      let bricks = [];
      let drops = [];
      let lasers = [];
      let particles = [];

      let score = 0;
      let lives = 3;
      let stage = 1;
      let running = false;
      let laserCharges = 0;

      // Timed effect timers (seconds)
      let wideTimer = 0;
      let shrinkTimer = 0;
      let magnetTimer = 0;
      let turboTimer = 0;
      let reverseTimer = 0;

      // Input state
      const keys = {};
      let moveLeftHeld = false;
      let moveRightHeld = false;
      let activeDragPointerId = null;
      let dragTargetX = null;

      // WebAudio Synth
      let audioCtx = null;
      function beep(freq, dur = 0.05, type = 'triangle', vol = 0.04) {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          g.gain.setValueAtTime(vol, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          osc.connect(g);
          g.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        } catch {}
      }

      function addParticles(x, y, color, count = 8) {
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const spd = 45 + Math.random() * 130;
          particles.push({
            x, y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd,
            r: 2 + Math.random() * 2.2,
            color,
            ttl: 0.25 + Math.random() * 0.2
          });
        }
      }

      function buildRandomBricks(lvl) {
        bricks = [];
        const rows = Math.min(7, 4 + Math.floor(lvl / 2));
        const cols = 8;
        const pad = 6;
        const bw = (W - pad * (cols + 1)) / cols;
        const bh = 18;
        const pattern = lvl % 3;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            let keep = true;
            if (pattern === 0) keep = Math.random() > 0.24;
            else if (pattern === 1) keep = ((r + c) % 2 === 0) || Math.random() > 0.42;
            else keep = Math.random() > 0.14;

            if (!keep) continue;
            const armored = (lvl >= 2 && r === 0) || (lvl >= 3 && Math.random() < 0.22);
            bricks.push({
              x: pad + c * (bw + pad),
              y: 32 + r * (bh + pad),
              w: bw,
              h: bh,
              hp: armored ? 2 : 1,
              color: armored ? '#e2e8f0' : COLORS[(r + c) % COLORS.length]
            });
          }
        }

        if (bricks.length < 10) {
          for (let i = 0; i < 12; i++) {
            const c = i % cols;
            const r = Math.floor(i / cols);
            bricks.push({
              x: pad + c * (bw + pad),
              y: 32 + r * (bh + pad),
              w: bw,
              h: bh,
              hp: 1,
              color: COLORS[i % COLORS.length]
            });
          }
        }
      }

      function createBall(x, y, vx, vy, stuck = false) {
        return { x, y, r: 7, vx, vy, stuck, offsetFromPaddle: x - paddle.x };
      }

      function resetPaddleAndBall() {
        wideTimer = 0;
        shrinkTimer = 0;
        turboTimer = 0;
        reverseTimer = 0;
        magnetTimer = 0;
        paddle.w = BASE_PADDLE_W;
        paddle.x = W / 2;
        dragTargetX = null;
        drops = [];
        lasers = [];

        const baseSpd = 240 + (stage - 1) * 18;
        const angle = -Math.PI / 2 + (Math.random() * 0.46 - 0.23);
        balls = [createBall(paddle.x, paddle.y - 9, Math.cos(angle) * baseSpd, Math.sin(angle) * baseSpd, false)];
        syncHud();
      }

      function startNewGame() {
        score = 0;
        lives = 3;
        stage = 1;
        laserCharges = 0;
        particles = [];
        buildRandomBricks(stage);
        resetPaddleAndBall();
        running = true;
        overlay.classList.remove('visible');
        syncHud();
      }

      function syncHud() {
        scoreEl.textContent = score;
        stageEl.textContent = stage;
        livesEl.textContent = lives;
        btnLaser.disabled = !running || laserCharges <= 0;
        btnLaser.textContent = `⚡ LASER (${laserCharges})`;

        const pills = [];
        if (wideTimer > 0) pills.push(`<span class="fx-pill good">WIDE ${wideTimer.toFixed(1)}s</span>`);
        if (shrinkTimer > 0) pills.push(`<span class="fx-pill bad">SHRINK ${shrinkTimer.toFixed(1)}s</span>`);
        if (magnetTimer > 0) pills.push(`<span class="fx-pill good">MAGNET ${magnetTimer.toFixed(1)}s</span>`);
        if (turboTimer > 0) pills.push(`<span class="fx-pill bad">TURBO ${turboTimer.toFixed(1)}s</span>`);
        if (reverseTimer > 0) pills.push(`<span class="fx-pill bad">REVERSE ${reverseTimer.toFixed(1)}s</span>`);
        effectsStrip.innerHTML = pills.join('');
      }

      function maybeSpawnDrop(bx, by) {
        if (Math.random() > 0.28) return;
        const pool = [
          { kind: 'W', label: 'W', color: '#34d399', good: true },  // Wide Paddle
          { kind: 'M', label: 'M', color: '#38bdf8', good: true },  // Multi-Ball
          { kind: 'G', label: 'G', color: '#a855f7', good: true },  // Magnet Catch
          { kind: 'L', label: 'L', color: '#facc15', good: true },  // Laser Shots
          { kind: 'S', label: 'S', color: '#f43f5e', good: false }, // Shrink Paddle
          { kind: 'T', label: 'T', color: '#fb7185', good: false }, // Turbo Ball
          { kind: 'R', label: 'R', color: '#e879f9', good: false }  // Reverse Controls
        ];
        const item = pool[Math.floor(Math.random() * pool.length)];
        drops.push({ ...item, x: bx, y: by, r: 10, vy: 115 });
      }

      function applyDrop(d) {
        beep(d.good ? 680 : 190, 0.1, d.good ? 'sine' : 'sawtooth', 0.05);
        addParticles(d.x, d.y, d.color, 10);

        if (d.kind === 'W') {
          shrinkTimer = 0;
          wideTimer = 11;
          paddle.w = Math.min(MAX_PADDLE_W, BASE_PADDLE_W + 44);
        } else if (d.kind === 'S') {
          wideTimer = 0;
          shrinkTimer = 9;
          paddle.w = Math.max(MIN_PADDLE_W, BASE_PADDLE_W - 30);
        } else if (d.kind === 'M') {
          const anchor = balls[0] || { x: paddle.x, y: paddle.y - 12, vx: 210, vy: -240 };
          if (balls.length < 4) {
            balls.push(createBall(anchor.x, anchor.y, -anchor.vx || 220, anchor.vy || -240, false));
            balls.push(createBall(anchor.x, anchor.y, anchor.vx * 0.8 + 90, -(Math.abs(anchor.vy) || 230), false));
          }
        } else if (d.kind === 'G') {
          magnetTimer = 12;
        } else if (d.kind === 'L') {
          laserCharges += 3;
        } else if (d.kind === 'T') {
          turboTimer = 8;
        } else if (d.kind === 'R') {
          reverseTimer = 8;
        }
        syncHud();
      }

      function fireLaser() {
        if (!running || laserCharges <= 0) return;
        laserCharges--;
        beep(840, 0.08, 'sawtooth', 0.05);
        lasers.push({ x: paddle.x - paddle.w * 0.32, y: paddle.y - 6, vy: -520 });
        lasers.push({ x: paddle.x + paddle.w * 0.32, y: paddle.y - 6, vy: -520 });
        syncHud();
      }

      function hitBrickAt(idx) {
        const b = bricks[idx];
        if (!b) return;
        b.hp--;
        addParticles(b.x + b.w / 2, b.y + b.h / 2, b.color, 7);
        beep(440 + (idx % 5) * 40, 0.04, 'triangle', 0.035);

        if (b.hp <= 0) {
          maybeSpawnDrop(b.x + b.w / 2, b.y + b.h / 2);
          bricks.splice(idx, 1);
          score += 20 * stage;
        } else {
          score += 10;
          b.color = COLORS[idx % COLORS.length];
        }
        syncHud();
      }

      function update(dt) {
        if (!running) return;

        // Tick timers
        let timerChanged = false;
        const tickFx = (val) => {
          if (val > 0) { timerChanged = true; return Math.max(0, val - dt); }
          return 0;
        };
        wideTimer = tickFx(wideTimer);
        shrinkTimer = tickFx(shrinkTimer);
        magnetTimer = tickFx(magnetTimer);
        turboTimer = tickFx(turboTimer);
        reverseTimer = tickFx(reverseTimer);

        if (wideTimer === 0 && shrinkTimer === 0 && paddle.w !== BASE_PADDLE_W) {
          paddle.w = BASE_PADDLE_W;
        }
        if (timerChanged) syncHud();

        // Paddle Movement (Keyboard + Mobile Buttons + Direct Touch/Pointer Drag)
        const dirSign = reverseTimer > 0 ? -1 : 1;
        let moveAxis = 0;
        if (keys['ArrowLeft'] || keys['KeyA'] || moveLeftHeld) moveAxis -= 1;
        if (keys['ArrowRight'] || keys['KeyD'] || moveRightHeld) moveAxis += 1;

        if (moveAxis !== 0) {
          dragTargetX = null;
          paddle.x += moveAxis * dirSign * 420 * dt;
        } else if (dragTargetX !== null) {
          const target = reverseTimer > 0 ? (W - dragTargetX) : dragTargetX;
          paddle.x += (target - paddle.x) * Math.min(1, dt * 22);
        }

        paddle.x = Math.max(paddle.w / 2 + 4, Math.min(W - paddle.w / 2 - 4, paddle.x));

        // Laser bolts
        for (let i = lasers.length - 1; i >= 0; i--) {
          const l = lasers[i];
          l.y += l.vy * dt;
          if (l.y < 0) { lasers.splice(i, 1); continue; }
          let hit = false;
          for (let j = bricks.length - 1; j >= 0; j--) {
            const b = bricks[j];
            if (l.x >= b.x && l.x <= b.x + b.w && l.y >= b.y && l.y <= b.y + b.h) {
              hitBrickAt(j);
              hit = true;
              break;
            }
          }
          if (hit) lasers.splice(i, 1);
        }

        // Power-up / Power-down drops
        for (let i = drops.length - 1; i >= 0; i--) {
          const d = drops[i];
          d.y += d.vy * dt;
          if (
            d.y + d.r >= paddle.y &&
            d.y - d.r <= paddle.y + paddle.h &&
            Math.abs(d.x - paddle.x) <= paddle.w / 2 + d.r
          ) {
            drops.splice(i, 1);
            applyDrop(d);
            continue;
          }
          if (d.y - d.r > H) drops.splice(i, 1);
        }

        // Balls
        const speedMult = turboTimer > 0 ? 1.32 : 1.0;
        for (let i = balls.length - 1; i >= 0; i--) {
          const b = balls[i];
          if (b.stuck) {
            b.x = Math.max(b.r + 4, Math.min(W - b.r - 4, paddle.x + b.offsetFromPaddle));
            b.y = paddle.y - b.r - 1;
            continue;
          }

          b.x += b.vx * speedMult * dt;
          b.y += b.vy * speedMult * dt;

          if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); beep(240, 0.03, 'sine', 0.025); }
          if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); beep(240, 0.03, 'sine', 0.025); }
          if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy); beep(240, 0.03, 'sine', 0.025); }

          // Paddle bounce or magnet catch
          if (
            b.vy > 0 &&
            b.y + b.r >= paddle.y &&
            b.y - b.r <= paddle.y + paddle.h &&
            Math.abs(b.x - paddle.x) <= paddle.w / 2 + b.r
          ) {
            const offset = Math.max(-0.9, Math.min(0.9, (b.x - paddle.x) / (paddle.w / 2)));
            const curSpd = Math.min(540, Math.hypot(b.vx, b.vy) * 1.02);
            const ang = offset * 1.02;
            b.vx = Math.sin(ang) * curSpd;
            b.vy = -Math.abs(Math.cos(ang) * curSpd);
            b.y = paddle.y - b.r - 1;

            if (magnetTimer > 0) {
              b.stuck = true;
              b.offsetFromPaddle = b.x - paddle.x;
            }
            beep(360, 0.04, 'square', 0.03);
          }

          // Brick collision
          for (let j = bricks.length - 1; j >= 0; j--) {
            const br = bricks[j];
            if (
              b.x + b.r > br.x &&
              b.x - b.r < br.x + br.w &&
              b.y + b.r > br.y &&
              b.y - b.r < br.y + br.h
            ) {
              hitBrickAt(j);
              b.vy = -b.vy;
              break;
            }
          }

          if (b.y - b.r > H) {
            balls.splice(i, 1);
          }
        }

        if (balls.length === 0) {
          lives--;
          syncHud();
          beep(150, 0.2, 'sawtooth', 0.05);
          if (lives <= 0) {
            running = false;
            ovTitle.textContent = 'GAME OVER';
            ovSub.textContent = `Final Score: ${score} · Reached Stage ${stage}`;
            startBtn.textContent = 'PLAY AGAIN';
            overlay.classList.add('visible');
          } else {
            resetPaddleAndBall();
          }
          return;
        }

        if (bricks.length === 0) {
          stage++;
          score += 150;
          beep(620, 0.14, 'triangle', 0.06);
          buildRandomBricks(stage);
          resetPaddleAndBall();
          syncHud();
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.ttl -= dt;
          if (p.ttl <= 0) particles.splice(i, 1);
        }
      }

      function render() {
        ctx.fillStyle = '#090d1a';
        ctx.fillRect(0, 0, W, H);

        // Bricks
        bricks.forEach(b => {
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.roundRect(b.x, b.y, b.w, b.h, 4);
          ctx.fill();
          if (b.hp > 1) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(b.x + 1.5, b.y + 1.5, b.w - 3, b.h - 3);
          }
        });

        // Power-up / Power-down Capsules
        drops.forEach(d => {
          ctx.save();
          ctx.fillStyle = d.color;
          ctx.beginPath();
          ctx.roundRect(d.x - 11, d.y - 8, 22, 16, 6);
          ctx.fill();
          ctx.fillStyle = '#070a12';
          ctx.font = '900 10px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(d.label, d.x, d.y + 0.5);
          ctx.restore();
        });

        // Laser Beams
        ctx.fillStyle = '#facc15';
        lasers.forEach(l => {
          ctx.fillRect(l.x - 2, l.y - 8, 4, 14);
        });

        // Paddle
        ctx.save();
        ctx.fillStyle = shrinkTimer > 0 ? '#f43f5e' : wideTimer > 0 ? '#34d399' : '#38bdf8';
        ctx.beginPath();
        ctx.roundRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, 6);
        ctx.fill();
        ctx.restore();

        // Balls
        balls.forEach(b => {
          ctx.fillStyle = turboTimer > 0 ? '#fb7185' : '#facc15';
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
        });

        // Particles
        particles.forEach(p => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.ttl * 3);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }

      // Keyboard Controls
      window.addEventListener('keydown', e => {
        if (['ArrowLeft','ArrowRight','KeyA','KeyD','Space'].includes(e.code)) e.preventDefault();
        keys[e.code] = true;
        if (e.code === 'Space') {
          if (!running) return;
          // Release any magnet-held balls, or fire laser if charged
          let released = false;
          balls.forEach(b => { if (b.stuck) { b.stuck = false; released = true; } });
          if (!released) fireLaser();
        }
      });
      window.addEventListener('keyup', e => { keys[e.code] = false; });

      // Direct Touch / Pointer Drag on Canvas
      function setDragFromClientX(clientX) {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width) return;
        const normX = ((clientX - rect.left) / rect.width) * W;
        dragTargetX = Math.max(paddle.w / 2 + 4, Math.min(W - paddle.w / 2 - 4, normX));
      }

      stageWrap.addEventListener('pointerdown', e => {
        if (!running) return;
        if (e.target.closest('.overlay')) return;
        e.preventDefault();
        activeDragPointerId = e.pointerId;
        setDragFromClientX(e.clientX);
        // Release stuck magnet ball on tap
        balls.forEach(b => { if (b.stuck) b.stuck = false; });
      }, { passive: false });

      stageWrap.addEventListener('pointermove', e => {
        if (!running) return;
        if (e.pointerType === 'mouse' || activeDragPointerId === e.pointerId) {
          setDragFromClientX(e.clientX);
        }
      }, { passive: false });

      const endDrag = e => {
        if (activeDragPointerId === e.pointerId) {
          activeDragPointerId = null;
        }
      };
      stageWrap.addEventListener('pointerup', endDrag);
      stageWrap.addEventListener('pointercancel', endDrag);

      // Mobile Left/Right/Laser Buttons
      function bindHoldButton(btn, setFlag) {
        const on = e => {
          if (e.cancelable) e.preventDefault();
          dragTargetX = null;
          setFlag(true);
          btn.classList.add('pressed');
        };
        const off = e => {
          if (e.cancelable) e.preventDefault();
          setFlag(false);
          btn.classList.remove('pressed');
        };
        btn.addEventListener('pointerdown', on, { passive: false });
        btn.addEventListener('pointerup', off, { passive: false });
        btn.addEventListener('pointerleave', off, { passive: false });
        btn.addEventListener('pointercancel', off, { passive: false });
        btn.addEventListener('touchstart', on, { passive: false });
        btn.addEventListener('touchend', off, { passive: false });
        btn.addEventListener('touchcancel', off, { passive: false });
      }

      bindHoldButton(btnLeft, v => { moveLeftHeld = v; });
      bindHoldButton(btnRight, v => { moveRightHeld = v; });

      btnLaser.addEventListener('pointerdown', e => {
        if (e.cancelable) e.preventDefault();
        balls.forEach(b => { if (b.stuck) b.stuck = false; });
        fireLaser();
      }, { passive: false });
      btnLaser.addEventListener('touchstart', e => {
        if (e.cancelable) e.preventDefault();
        balls.forEach(b => { if (b.stuck) b.stuck = false; });
        fireLaser();
      }, { passive: false });

      startBtn.addEventListener('click', startNewGame);
      startBtn.addEventListener('touchend', e => {
        if (e.cancelable) e.preventDefault();
        startNewGame();
      }, { passive: false });

      let lastTs = performance.now();
      function loop(ts) {
        const dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
