<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Prism Brick Breaker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      overflow: hidden;
    }
    .hud {
      width: min(480px, 95vw);
      display: flex;
      justify-content: space-between;
      background: #131520;
      border: 1px solid #25293d;
      border-radius: 12px;
      padding: 9px 16px;
      font-weight: 800;
      font-size: 0.9rem;
    }
    .hud .score { color: #38bdf8; }
    .hud .stage { color: #a78bfa; }
    .hud .lives { color: #f43f5e; }
    .stage-wrap {
      position: relative;
      width: min(480px, 95vw);
      aspect-ratio: 4 / 3;
      background: #0b0e19;
      border: 2px solid #25293d;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
      touch-action: none;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.86);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }
    .overlay.visible { display: flex; }
    .btn {
      background: linear-gradient(135deg, #6842ff, #ea580c);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 22px;
      font-weight: 800;
      cursor: pointer;
    }
    .hint { font-size: 0.78rem; color: #9aa0b8; }
  </style>
</head>
<body>
  <div class="hud">
    <span class="score">SCORE: <b id="scoreVal">0</b></span>
    <span class="stage">STAGE: <b id="stageVal">1</b></span>
    <span class="lives">BALLS: <b id="livesVal">3</b></span>
  </div>
  <div class="stage-wrap">
    <canvas id="brkCanvas" width="480" height="360"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle" style="font-size:1.55rem; color:#fb923c;">PRISM BREAKER</h2>
      <p id="ovSub" style="color:#9aa0b8; font-size:0.88rem;">Move mouse, touch, or A/D / Arrows to bounce the prism orb!</p>
      <button class="btn" id="startBtn">Launch Orb</button>
    </div>
  </div>
  <div class="hint">Mouse / Touch / Left-Right Arrows to move paddle</div>

  <script>
    const canvas = document.getElementById('brkCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreVal');
    const stageEl = document.getElementById('stageVal');
    const livesEl = document.getElementById('livesVal');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');
    const ovSub = document.getElementById('ovSub');
    const startBtn = document.getElementById('startBtn');

    const COLORS = ['#f43f5e', '#fb923c', '#facc15', '#34d399', '#38bdf8', '#a855f7'];
    let paddle = { x: 240, y: 332, w: 84, h: 12 };
    let ball = { x: 240, y: 314, r: 7, vx: 3.4, vy: -3.8 };
    let bricks = [];
    let score = 0, lives = 3, stage = 1, running = false;
    let keys = {};

    function buildBricks(lvl) {
      bricks = [];
      const rows = Math.min(7, 4 + Math.floor(lvl / 2));
      const cols = 8;
      const pad = 6;
      const bw = (480 - pad * (cols + 1)) / cols;
      const bh = 18;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const hp = lvl >= 2 && r === 0 ? 2 : 1;
          bricks.push({
            x: pad + c * (bw + pad),
            y: 34 + r * (bh + pad),
            w: bw,
            h: bh,
            hp,
            color: COLORS[r % COLORS.length]
          });
        }
      }
    }

    function resetBall() {
      paddle.x = 240;
      ball.x = 240;
      ball.y = paddle.y - ball.r - 2;
      const spd = 3.8 + (stage - 1) * 0.35;
      const angle = -Math.PI / 2 + (Math.random() * 0.5 - 0.25);
      ball.vx = Math.cos(angle) * spd;
      ball.vy = Math.sin(angle) * spd;
    }

    function startNew() {
      score = 0; lives = 3; stage = 1;
      buildBricks(stage);
      resetBall();
      running = true;
      overlay.classList.add('hidden');
      syncHud();
    }

    function syncHud() {
      scoreEl.textContent = score;
      stageEl.textContent = stage;
      livesEl.textContent = lives;
    }

    window.addEventListener('keydown', e => {
      if (['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code)) e.preventDefault();
      keys[e.code] = true;
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    canvas.addEventListener('pointermove', e => {
      if (!running) return;
      const rect = canvas.getBoundingClientRect();
      const relX = ((e.clientX - rect.left) / rect.width) * canvas.width;
      paddle.x = Math.max(paddle.w / 2, Math.min(canvas.width - paddle.w / 2, relX));
    });

    function update() {
      if (!running) return;

      if (keys['ArrowLeft'] || keys['KeyA']) paddle.x -= 6.5;
      if (keys['ArrowRight'] || keys['KeyD']) paddle.x += 6.5;
      paddle.x = Math.max(paddle.w / 2, Math.min(canvas.width - paddle.w / 2, paddle.x));

      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
      if (ball.x + ball.r > canvas.width) { ball.x = canvas.width - ball.r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

      // Paddle bounce
      if (
        ball.vy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        Math.abs(ball.x - paddle.x) <= paddle.w / 2 + ball.r
      ) {
        const offset = (ball.x - paddle.x) / (paddle.w / 2);
        const speed = Math.hypot(ball.vx, ball.vy) * 1.015;
        const bounceAngle = offset * 1.05;
        ball.vx = Math.sin(bounceAngle) * speed;
        ball.vy = -Math.abs(Math.cos(bounceAngle) * speed);
      }

      // Bricks collision
      for (let i = bricks.length - 1; i >= 0; i--) {
        const b = bricks[i];
        if (
          ball.x + ball.r > b.x &&
          ball.x - ball.r < b.x + b.w &&
          ball.y + ball.r > b.y &&
          ball.y - ball.r < b.y + b.h
        ) {
          bricks[i].hp--;
          if (bricks[i].hp <= 0) {
            bricks.splice(i, 1);
            score += 20 * stage;
          } else {
            score += 10;
            bricks[i].color = '#e2e8f0';
          }
          ball.vy = -ball.vy;
          syncHud();
          break;
        }
      }

      if (bricks.length === 0) {
        stage++;
        score += 150;
        buildBricks(stage);
        resetBall();
        syncHud();
      }

      if (ball.y - ball.r > canvas.height) {
        lives--;
        syncHud();
        if (lives <= 0) {
          running = false;
          ovTitle.textContent = 'GAME OVER';
          ovSub.textContent = `Final Score: ${score} · Reached Stage ${stage}`;
          startBtn.textContent = 'Play Again';
          overlay.classList.remove('hidden');
        } else {
          resetBall();
        }
      }
    }

    function render() {
      ctx.fillStyle = '#0b0e19';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      bricks.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 4);
        ctx.fill();
      });

      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();

      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    startBtn.addEventListener('click', startNew);
    loop();
  </script>
</body>
</html>
