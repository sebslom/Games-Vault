<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cyber Minefield</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: 'JetBrains Mono', 'Inter', system-ui, monospace;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
    }
    .top-bar {
      width: min(440px, 95vw);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #131520;
      border: 1px solid #25293d;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 0.86rem;
    }
    .mines { color: #f43f5e; }
    .timer { color: #38bdf8; }
    .diff-select {
      background: #1c2033;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 5px 8px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .board {
      background: #131520;
      border: 2px solid #25293d;
      border-radius: 14px;
      padding: 8px;
      display: grid;
      gap: 4px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
      max-width: 96vw;
      overflow: auto;
    }
    .cell {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid #2c334d;
      background: #1d2236;
      color: #f8fafc;
      font-family: inherit;
      font-weight: 900;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, transform 0.08s;
    }
    .cell:hover:not(.revealed) { background: #28304d; }
    .cell.revealed {
      background: #0b0e18;
      border-color: #181d2e;
      cursor: default;
    }
    .cell.flagged {
      background: rgba(250, 204, 21, 0.16);
      border-color: #facc15;
      color: #facc15;
    }
    .cell.mine-hit {
      background: #dc2626;
      border-color: #fca5a5;
      color: #fff;
    }
    .controls {
      width: min(440px, 95vw);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      color: #9aa0b8;
    }
    .mode-toggle {
      background: #6842ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .mode-toggle.flag-on { background: #eab308; color: #090d16; }
    .reset-btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 12px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }
    @media (max-width: 460px) {
      .cell { width: 28px; height: 28px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <span class="mines">MINES: <b id="minesLeft">0</b></span>
    <span class="timer">TIME: <b id="timeVal">0</b>s</span>
    <select id="diffSelect" class="diff-select">
      <option value="easy">9x9 (10)</option>
      <option value="medium" selected>10x10 (15)</option>
      <option value="hard">12x12 (24)</option>
    </select>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button class="mode-toggle" id="flagModeBtn">MODE: DIG</button>
    <span id="statusMsg">Left-click dig · Right-click flag</span>
    <button class="reset-btn" id="resetBtn">New Grid</button>
  </div>

  <script>
    const PRESETS = {
      easy: { rows: 9, cols: 9, mines: 10 },
      medium: { rows: 10, cols: 10, mines: 15 },
      hard: { rows: 12, cols: 12, mines: 24 }
    };
    const NUM_COLORS = {
      1: '#38bdf8',
      2: '#34d399',
      3: '#facc15',
      4: '#fb923c',
      5: '#f43f5e',
      6: '#c084fc',
      7: '#f472b6',
      8: '#e2e8f0'
    };

    const boardEl = document.getElementById('board');
    const minesLeftEl = document.getElementById('minesLeft');
    const timeValEl = document.getElementById('timeVal');
    const diffSelect = document.getElementById('diffSelect');
    const flagModeBtn = document.getElementById('flagModeBtn');
    const statusMsg = document.getElementById('statusMsg');
    const resetBtn = document.getElementById('resetBtn');

    let rows, cols, totalMines;
    let grid, revealed, flagged, gameOver, won, firstClick, flagMode, seconds, timerId;

    function initGame() {
      const cfg = PRESETS[diffSelect.value] || PRESETS.medium;
      rows = cfg.rows;
      cols = cfg.cols;
      totalMines = cfg.mines;

      grid = Array.from({ length: rows }, () => Array(cols).fill(0));
      revealed = Array.from({ length: rows }, () => Array(cols).fill(false));
      flagged = Array.from({ length: rows }, () => Array(cols).fill(false));
      gameOver = false;
      won = false;
      firstClick = true;
      seconds = 0;
      clearInterval(timerId);
      timeValEl.textContent = '0';
      statusMsg.textContent = 'Click any cell to start!';
      boardEl.style.gridTemplateColumns = `repeat(${cols}, auto)`;
      updateMinesLeft();
      render();
    }

    function placeMines(safeR, safeC) {
      let placed = 0;
      while (placed < totalMines) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);
        if (grid[r][c] === -1) continue;
        if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
        grid[r][c] = -1;
        placed++;
      }
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c] === -1) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] === -1) count++;
            }
          }
          grid[r][c] = count;
        }
      }
      timerId = setInterval(() => {
        if (!gameOver && !won) {
          seconds++;
          timeValEl.textContent = seconds;
        }
      }, 1000);
    }

    function updateMinesLeft() {
      let fCount = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (flagged[r][c]) fCount++;
        }
      }
      minesLeftEl.textContent = Math.max(0, totalMines - fCount);
    }

    function floodReveal(r, c) {
      if (r < 0 || r >= rows || c < 0 || c >= cols) return;
      if (revealed[r][c] || flagged[r][c]) return;
      revealed[r][c] = true;
      if (grid[r][c] === 0) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr !== 0 || dc !== 0) floodReveal(r + dr, c + dc);
          }
        }
      }
    }

    function checkWin() {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c] !== -1 && !revealed[r][c]) return false;
        }
      }
      return true;
    }

    function onCellClick(r, c, forceFlag = false) {
      if (gameOver || won) return;
      if (forceFlag || flagMode) {
        if (revealed[r][c]) return;
        flagged[r][c] = !flagged[r][c];
        updateMinesLeft();
        render();
        return;
      }
      if (flagged[r][c] || revealed[r][c]) return;

      if (firstClick) {
        firstClick = false;
        placeMines(r, c);
      }

      if (grid[r][c] === -1) {
        revealed[r][c] = true;
        gameOver = true;
        for (let rr = 0; rr < rows; rr++) {
          for (let cc = 0; cc < cols; cc++) {
            if (grid[rr][cc] === -1) revealed[rr][cc] = true;
          }
        }
        statusMsg.textContent = 'BOOM! Mine detonated!';
        render(r, c);
        return;
      }

      floodReveal(r, c);
      if (checkWin()) {
        won = true;
        statusMsg.textContent = `SECTOR SECURED in ${seconds}s!`;
      } else {
        statusMsg.textContent = 'Scanning sector...';
      }
      render();
    }

    function render(hitR = -1, hitC = -1) {
      boardEl.innerHTML = '';
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cell';

          if (revealed[r][c]) {
            btn.classList.add('revealed');
            if (grid[r][c] === -1) {
              btn.textContent = '💣';
              if (r === hitR && c === hitC) btn.classList.add('mine-hit');
            } else if (grid[r][c] > 0) {
              btn.textContent = grid[r][c];
              btn.style.color = NUM_COLORS[grid[r][c]] || '#fff';
            }
          } else if (flagged[r][c]) {
            btn.classList.add('flagged');
            btn.textContent = '⚑';
          }

          btn.addEventListener('click', () => onCellClick(r, c, false));
          btn.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            onCellClick(r, c, true);
          });
          boardEl.appendChild(btn);
        }
      }
    }

    flagModeBtn.addEventListener('click', () => {
      flagMode = !flagMode;
      flagModeBtn.textContent = flagMode ? 'MODE: FLAG' : 'MODE: DIG';
      flagModeBtn.classList.toggle('flag-on', flagMode);
    });

    diffSelect.addEventListener('change', initGame);
    resetBtn.addEventListener('click', initGame);

    flagMode = false;
    initGame();
  </script>
</body>
</html>
