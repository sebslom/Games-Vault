<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FruityWeb Studio 26 Ultra · Mobile & Desktop DAW</title>
  <style>
    :root {
      --bg-app: #111419;
      --bg-panel: #191e26;
      --bg-header: #222833;
      --bg-dark: #0c0f14;
      --bg-slot: #28303d;
      --border: #333d4f;
      --border-hi: #4b5870;
      --fl-orange: #ff7b00;
      --fl-orange-soft: rgba(255, 123, 0, 0.18);
      --fl-green: #22c55e;
      --fl-cyan: #38bdf8;
      --fl-red: #ef4444;
      --fl-yellow: #facc15;
      --fl-purple: #a855f7;
      --step-a: #3a4252;
      --step-b: #2b3240;
      --step-on-a: #ff8c1a;
      --step-on-b: #e11d48;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-app);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 12px;
      touch-action: manipulation;
    }

    .daw-root {
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg-app);
    }

    .top-bar {
      min-height: 52px;
      background: linear-gradient(180deg, #2a313d 0%, #1c2129 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 5px 10px;
      padding-right: 48px;
      gap: 6px;
      flex-shrink: 0;
      z-index: 30;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .logo-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #101318;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 9px;
      font-weight: 900;
      color: var(--fl-orange);
      letter-spacing: 0.4px;
    }
    .logo-badge span {
      color: #f8fafc;
      font-weight: 700;
    }

    .file-toolbar {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .tb-btn {
      background: var(--bg-slot);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .tb-btn:hover {
      border-color: var(--fl-orange);
    }
    .tb-btn.export-primary {
      background: rgba(34, 197, 94, 0.18);
      border-color: var(--fl-green);
      color: #86efac;
    }

    .transport-deck {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #101319;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px 7px;
    }

    .pat-song-switch {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .ps-btn {
      font-size: 9px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid #323b4a;
      background: #1b2029;
      color: var(--muted);
      cursor: pointer;
    }
    .ps-btn.active.pat {
      background: var(--fl-orange);
      color: #000;
      border-color: var(--fl-orange);
    }
    .ps-btn.active.song {
      background: var(--fl-green);
      color: #000;
      border-color: var(--fl-green);
    }

    .tr-btn {
      width: 32px;
      height: 30px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: #242b36;
      color: var(--text);
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tr-btn.active-play {
      background: var(--fl-green);
      color: #05180c;
      border-color: #86efac;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.45);
    }
    .tr-btn.rec-on {
      background: var(--fl-red);
      color: #fff;
      border-color: #fca5a5;
    }

    .lcd-box {
      background: #080a0e;
      border: 1px inset #384152;
      border-radius: 5px;
      padding: 2px 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
    }
    .lcd-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .lcd-tag {
      font-size: 8px;
      color: #64748b;
      font-weight: 800;
    }
    .lcd-num {
      font-size: 12px;
      font-weight: 900;
      color: var(--fl-orange);
    }
    .lcd-num.green {
      color: var(--fl-green);
    }
    .bpm-field {
      width: 46px;
      background: #0d1117;
      border: 1px solid #333d4f;
      color: var(--fl-orange);
      font-family: inherit;
      font-weight: 900;
      font-size: 12px;
      text-align: center;
      border-radius: 3px;
      padding: 1px;
    }

    .scope-canvas {
      width: 84px;
      height: 30px;
      background: #07090d;
      border: 1px solid #2d3646;
      border-radius: 4px;
      display: block;
    }

    .desktop-views {
      display: flex;
      gap: 4px;
    }
    .view-pill {
      background: #1a1f28;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 9px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .view-pill.active {
      background: #323c4e;
      color: var(--fl-orange);
      border-color: var(--fl-orange);
    }

    .daw-body {
      flex: 1;
      display: grid;
      grid-template-columns: 245px 1fr 315px;
      overflow: hidden;
      position: relative;
    }

    .pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-panel);
    }
    .pane.browser {
      border-right: 1px solid var(--border);
    }
    .pane.inspector {
      border-left: 1px solid var(--border);
      overflow-y: auto;
    }
    .pane.center {
      background: #141820;
    }

    .pane-head {
      height: 30px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      color: #cbd5e1;
      flex-shrink: 0;
    }

    .search-bar {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 5px;
    }
    .search-input {
      flex: 1;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 8px;
      color: var(--text);
      font-size: 11px;
      outline: none;
    }

    .browser-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .folder-box {
      background: #141820;
      border: 1px solid #28303e;
      border-radius: 6px;
      overflow: hidden;
    }
    .folder-head {
      background: #202632;
      padding: 5px 8px;
      font-weight: 800;
      font-size: 11px;
      color: var(--fl-orange);
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }
    .folder-list {
      padding: 3px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sample-row {
      padding: 5px 7px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .sample-row:hover {
      background: #293140;
    }
    .add-btn {
      background: #313b4d;
      border: none;
      color: var(--fl-cyan);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }
    .add-btn:hover {
      background: var(--fl-cyan);
      color: #000;
    }

    .pattern-toolbar {
      background: #1c212b;
      border-bottom: 1px solid var(--border);
      padding: 5px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pat-list {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .pat-chip {
      background: #262e3b;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .pat-chip.active {
      background: var(--fl-orange);
      color: #090c10;
      border-color: #fdba74;
    }

    .center-subview {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }
    .center-subview.active {
      display: flex;
    }

    .rack-area {
      flex: 1;
      overflow: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .ch-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1f2530;
      border: 1px solid #2f3848;
      border-radius: 6px;
      padding: 5px 7px;
      min-width: max-content;
    }
    .ch-strip.selected {
      border-color: var(--fl-orange);
      box-shadow: 0 0 0 1px rgba(255, 123, 0, 0.35);
    }

    .led-btn {
      width: 13px;
      height: 26px;
      border-radius: 3px;
      border: 1px solid #0b0d12;
      background: var(--fl-green);
      cursor: pointer;
    }
    .led-btn.muted {
      background: #334155;
    }

    .mini-slider {
      width: 36px;
      accent-color: var(--fl-orange);
      cursor: pointer;
    }

    .ch-label-btn {
      width: 124px;
      height: 28px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #2b3342;
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
    }

    .step-row {
      display: flex;
      gap: 3px;
      align-items: center;
    }
    .step-pad {
      width: 24px;
      height: 30px;
      border-radius: 4px;
      border: 1px solid #161a22;
      cursor: pointer;
    }
    .step-pad.grp-a { background: var(--step-a); }
    .step-pad.grp-b { background: var(--step-b); }
    .step-pad.on.grp-a { background: var(--step-on-a); border-color: #fed7aa; }
    .step-pad.on.grp-b { background: var(--step-on-b); border-color: #fecdd3; }
    .step-pad.now {
      outline: 2px solid #ffffff;
      box-shadow: 0 0 10px #ffffff;
      z-index: 2;
    }
    .step-pad:nth-child(4n) {
      margin-right: 5px;
    }

    .pr-jump-btn {
      background: #151a22;
      border: 1px solid var(--border);
      color: var(--fl-cyan);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Piano Roll */
    .pr-container {
      flex: 1;
      display: flex;
      overflow: auto;
      background: #10141b;
    }
    .pr-piano {
      width: 56px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #080a0e;
    }
    .piano-key {
      height: 22px;
      border-bottom: 1px solid #29313e;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 5px;
      font-size: 9px;
      font-weight: 800;
      cursor: pointer;
    }
    .piano-key.white { background: #e2e8f0; color: #0f172a; }
    .piano-key.black { background: #1e293b; color: #94a3b8; }
    .piano-key:active { background: var(--fl-orange); color: #000; }

    .pr-matrix {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 540px;
    }
    .pr-note-row {
      height: 22px;
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      border-bottom: 1px solid #1d2430;
    }
    .pr-note-row.sharp-row {
      background: rgba(8, 10, 16, 0.5);
    }
    .pr-slot {
      border-right: 1px solid #222a38;
      cursor: pointer;
    }
    .pr-slot:nth-child(4n) {
      border-right: 2px solid #364256;
    }
    .pr-slot.active {
      background: linear-gradient(180deg, #4ade80, #16a34a);
      border: 1px solid #bbf7d0;
      border-radius: 3px;
    }
    .pr-slot.now {
      background: rgba(255, 255, 255, 0.16);
    }

    /* Song Playlist */
    .playlist-area {
      flex: 1;
      overflow: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .track-lane {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: max-content;
    }
    .track-tag {
      width: 105px;
      background: #212733;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 7px 8px;
      font-weight: 800;
      font-size: 11px;
      color: var(--fl-orange);
    }
    .bar-slot {
      width: 50px;
      height: 30px;
      background: #191f29;
      border: 1px solid #2d3646;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      color: transparent;
    }
    .bar-slot.filled {
      background: linear-gradient(135deg, #2563eb, #0284c7);
      border-color: #7dd3fc;
      color: #ffffff;
    }
    .bar-slot.now {
      outline: 2px solid var(--fl-green);
    }

    /* Right Inspector: Synth + Multi-FX + Mixer */
    .sec-block {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 900;
      color: var(--fl-orange);
      font-size: 11px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .knob-card {
      background: #131720;
      border: 1px solid #293242;
      border-radius: 6px;
      padding: 5px 7px;
    }
    .knob-card label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 3px;
    }
    .knob-card label b {
      color: var(--fl-cyan);
    }
    .knob-card input[type="range"], .knob-card select {
      width: 100%;
      accent-color: var(--fl-orange);
      background: #0c0f15;
      color: #fff;
      border: 1px solid #323c4e;
      border-radius: 4px;
      font-size: 11px;
      padding: 2px;
    }

    .mixer-rack {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .fader-col {
      width: 52px;
      flex-shrink: 0;
      background: #131720;
      border: 1px solid #2b3444;
      border-radius: 6px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .fader-col.master {
      border-color: var(--fl-orange);
    }
    .fader-lbl {
      font-size: 9px;
      font-weight: 800;
      text-align: center;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .meter-bar {
      width: 10px;
      height: 62px;
      background: #080a0e;
      border: 1px solid #2a3242;
      border-radius: 3px;
      display: flex;
      flex-direction: column-reverse;
      overflow: hidden;
    }
    .meter-val {
      width: 100%;
      height: 0%;
      background: linear-gradient(0deg, #22c55e 0%, #facc15 72%, #ef4444 95%);
      transition: height 0.06s linear;
    }
    .v-fader {
      writing-mode: bt-lr;
      -webkit-appearance: slider-vertical;
      width: 18px;
      height: 60px;
      accent-color: var(--fl-orange);
      cursor: pointer;
    }

    /* Live Touch Keyboard */
    .live-kbd {
      height: 44px;
      background: #10131a;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: stretch;
      padding: 3px 8px;
      gap: 2px;
      flex-shrink: 0;
    }
    .live-key {
      flex: 1;
      border-radius: 0 0 5px 5px;
      border: 1px solid #1e293b;
      background: #e2e8f0;
      color: #0f172a;
      font-size: 9px;
      font-weight: 900;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 3px;
      cursor: pointer;
    }
    .live-key.sharp {
      background: #1e293b;
      color: #94a3b8;
      height: 68%;
    }
    .live-key:active {
      background: var(--fl-orange);
      color: #000;
    }

    /* Mobile Bottom Tab Switcher */
    .mobile-dock {
      display: none;
      height: 46px;
      background: #1a202a;
      border-top: 1px solid var(--border);
      grid-template-columns: repeat(5, 1fr);
      flex-shrink: 0;
      z-index: 25;
    }
    .mob-tab {
      background: transparent;
      border: none;
      border-right: 1px solid #262e3d;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
    }
    .mob-tab.active {
      background: rgba(255, 123, 0, 0.16);
      color: var(--fl-orange);
    }

    /* Export Audio Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(6, 8, 13, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 60;
    }
    .modal-bg.active {
      display: flex;
    }
    .modal-card {
      width: min(460px, 95vw);
      background: #191e27;
      border: 1.5px solid var(--fl-orange);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-card h3 {
      font-size: 15px;
      font-weight: 900;
      color: var(--fl-orange);
    }
    .form-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .form-row label {
      font-size: 11px;
      font-weight: 800;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
    }
    .form-row select, .form-row input[type="number"], .form-row input[type="text"] {
      background: #0d1016;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    @media (max-width: 900px) {
      .desktop-views { display: none; }
      .mobile-dock { display: grid; }
      .daw-body {
        display: block;
      }
      .pane {
        display: none;
        width: 100%;
        height: 100%;
        border: none;
      }
      .pane.mobile-active {
        display: flex;
      }
      .live-kbd {
        height: 38px;
      }
    }
  </style>
</head>
<body>
  <div class="daw-root">
    <header class="top-bar">
      <div class="brand-group">
        <div class="logo-badge">🍊 FRUITY<span>WEB 26</span></div>
        <div class="file-toolbar">
          <button type="button" class="tb-btn" id="importAudioBtn">📥 Sample</button>
          <button type="button" class="tb-btn" id="importProjBtn">📂 Wczytaj</button>
          <button type="button" class="tb-btn" id="saveProjBtn">💾 Zapisz</button>
          <button type="button" class="tb-btn export-primary" id="openExportBtn">💿 Eksport Audio</button>
        </div>
      </div>

      <div class="transport-deck">
        <div class="pat-song-switch">
          <button type="button" class="ps-btn active pat" id="modePatBtn">PAT</button>
          <button type="button" class="ps-btn song" id="modeSongBtn">SONG</button>
        </div>
        <button type="button" class="tr-btn" id="playBtn" title="Play / Pause [SPACE]">▶</button>
        <button type="button" class="tr-btn" id="stopBtn" title="Stop">■</button>
        <div class="lcd-box">
          <div class="lcd-col">
            <span class="lcd-tag">BPM</span>

<script>
    (() => {
      // =========================================================================
      // [MIEJSCE NA WŁASNE DŹWIĘKI I PRESETY]

            { id: 'hat_closed', name: 'Closed Hi-Hat',    color: '#facc15', engine: 'drum', preset: 'hatClosed', wave: 'square',   cutoff: 8500, attack: 0.001, decay: 0.06, sustain: 0.0, release: 0.03 },

        },
        {
          folder: '🎹 Synths · Bass & Leads',
          items: [
            { id: 'bass_reese',   name: 'Reese Saw Bass',   color: '#a855f7', engine: 'synth', preset: 'synth', wave: 'sawtooth', cutoff: 640,  attack: 0.015, decay: 0.22, sustain: 0.55, release: 0.16 },
            { id: 'bass_acid',    name: '303 Acid Squelch', color: '#ec4899', engine: 'synth', preset: 'synth', wave: 'sawtooth', cutoff: 1450, attack: 0.005, decay: 0.15, sustain: 0.25, release: 0.10 },
            { id: 'lead_supersaw',name: 'Supersaw Lead',    color: '#22c55e', engine: 'synth', preset: 'synth', wave: 'sawtooth', cutoff: 4400, attack: 0.02,  decay: 0.18, sustain: 0.65, release: 0.22 },
            { id: 'pluck_neon',   name: 'Neon Pluck',       color: '#06b6d4', engine: 'synth', preset: 'synth', wave: 'triangle', cutoff: 2600, attack: 0.005, decay: 0.20, sustain: 0.12, release: 0.14 },
            { id: 'keys_8bit',    name: '8-Bit Square Keys',color: '#f43f5e', engine: 'synth', preset: 'synth', wave: 'square',   cutoff: 3200, attack: 0.01,  decay: 0.16, sustain: 0.45, release: 0.15 },
            { id: 'pad_warm',     name: 'Cosmic Pad',       color: '#6366f1', engine: 'synth', preset: 'synth', wave: 'sine',     cutoff: 1700, attack: 0.12,  decay: 0.35, sustain: 0.75, release: 0.40 },
            { id: 'bell_fm',      name: 'Crystal FM Bell',  color: '#38bdf8', engine: 'synth', preset: 'synth', wave: 'sine',     cutoff: 5200, attack: 0.004, decay: 0.38, sustain: 0.10, release: 0.30 }
          ]
        },
        {
          folder: '⚡ FX & Percussion',
          items: [
            { id: 'fx_laser',   name: 'Laser Zap FX',     color: '#38bdf8', engine: 'drum', preset: 'laser',     wave: 'sawtooth', cutoff: 5000, attack: 0.002, decay: 0.22, sustain: 0.0, release: 0.08 },
            { id: 'fx_tom',     name: 'Electro Tom',      color: '#34d399', engine: 'drum', preset: 'tom',       wave: 'sine',     cutoff: 900,  attack: 0.004, decay: 0.25, sustain: 0.0, release: 0.09 },
            { id: 'fx_cowbell', name: '808 Cowbell',      color: '#fbbf24', engine: 'drum', preset: 'cowbell',   wave: 'square',   cutoff: 3400, attack: 0.002, decay: 0.16, sustain: 0.0, release: 0.06 }
          ]
        },
        {
          folder: '📁 Zaimportowane Sample',
          items: []
        }
      ];

      const NOTES = [
        { name: 'B5', midi: 83, sharp: false }, { name: 'A#5', midi: 82, sharp: true },
        { name: 'A5', midi: 81, sharp: false }, { name: 'G#5', midi: 80, sharp: true },
        { name: 'G5', midi: 79, sharp: false }, { name: 'F#5', midi: 78, sharp: true },
        { name: 'F5', midi: 77, sharp: false }, { name: 'E5',  midi: 76, sharp: false },
        { name: 'D#5',midi: 75, sharp: true  }, { name: 'D5',  midi: 74, sharp: false },
        { name: 'C#5',midi: 73, sharp: true  }, { name: 'C5',  midi: 72, sharp: false },
        { name: 'B4', midi: 71, sharp: false }, { name: 'A#4', midi: 70, sharp: true },
        { name: 'A4', midi: 69, sharp: false }, { name: 'G#4', midi: 68, sharp: true },
        { name: 'G4', midi: 67, sharp: false }, { name: 'F#4', midi: 66, sharp: true },
        { name: 'F4', midi: 65, sharp: false }, { name: 'E4',  midi: 64, sharp: false },
        { name: 'D#4',midi: 63, sharp: true  }, { name: 'D4',  midi: 62, sharp: false },
        { name: 'C#4',midi: 61, sharp: true  }, { name: 'C4',  midi: 60, sharp: false }
      ];

      function midiToFreq(midi) {
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

      let libraries = JSON.parse(JSON.stringify(DEFAULT_LIBRARIES));
      const importedBuffers = new Map();
      const importedDataUrls = new Map();

      let bpm = 128;
      let playMode = 'pat';
      let isPlaying = false;
      let currentStep = 0;
      let currentBar = 0;
      let activePatternIdx = 0;
      let selectedChannelIdx = 0;
      let activeView = 'rack';

      let masterVolume = 0.85;
      let fxDistortion = 0;
      let fxReverbWet = 0.18;
      let fxDelayWet = 0.20;
      let fxBassGain = 2;

      let channels = [
        { ...DEFAULT_LIBRARIES[0].items[0], uid: 'ch_1', volume: 0.92, pan: 0, muted: false },
        { ...DEFAULT_LIBRARIES[0].items[2], uid: 'ch_2', volume: 0.84, pan: 0, muted: false },
        { ...DEFAULT_LIBRARIES[0].items[4], uid: 'ch_3', volume: 0.65, pan: -0.15, muted: false },
        { ...DEFAULT_LIBRARIES[1].items[0], uid: 'ch_4', volume: 0.80, pan: 0, muted: false },
        { ...DEFAULT_LIBRARIES[1].items[3], uid: 'ch_5', volume: 0.76, pan: 0.15, muted: false }
      ];

      function createBlankPattern(name) {
        const data = {};
        channels.forEach(ch => {
          data[ch.uid] = { steps: Array(16).fill(false), notes: [] };
        });
        return { name, data };
      }

      let patterns = [
        createBlankPattern('Pattern 1'),
        createBlankPattern('Pattern 2'),
        createBlankPattern('Pattern 3'),
        createBlankPattern('Pattern 4')
      ];

      patterns[0].data['ch_1'].steps = [true,false,false,false, true,false,false,false, true,false,false,false, true,false,true,false];
      patterns[0].data['ch_2'].steps = [false,false,false,false, true,false,false,false, false,false,false,false, true,false,false,false];
      patterns[0].data['ch_3'].steps = [true,false,true,false, true,false,true,false, true,false,true,false, true,false,true,true];
      patterns[0].data['ch_4'].notes = [
        { step: 0, midi: 60 }, { step: 3, midi: 60 }, { step: 6, midi: 63 },
        { step: 8, midi: 65 }, { step: 11, midi: 63 }, { step: 14, midi: 67 }
      ];
      patterns[0].data['ch_5'].notes = [
        { step: 0, midi: 72 }, { step: 4, midi: 75 }, { step: 8, midi: 79 }, { step: 12, midi: 77 }
      ];

      patterns[1].data['ch_1'].steps = [true,false,true,false, true,false,false,false, true,false,true,false, true,true,false,true];
      patterns[1].data['ch_2'].steps = [false,false,false,false, true,false,false,true, false,false,false,false, true,false,true,false];
      patterns[1].data['ch_3'].steps = [true,true,true,true, true,true,true,true, true,true,true,true, true,true,true,true];

      let playlist = [
        [0, 0, 1, 1, 0, 0, 1, 1, null, null, null, null, null, null, null, null],
        [null, 0, 0, 1, 1, 0, 0, 1, null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null]
      ];

      // =========================================================================
      // AUDIO ENGINE + MULTI-FX GRAPH
      // =========================================================================
      let audioCtx = null;
      let masterGain = null;
      let bassFilter = null;
      let shaperNode = null;
      let delayNode = null;
      let delayGain = null;
      let reverbNode = null;
      let reverbGain = null;
      let analyser = null;

      function makeDistortionCurve(amount) {
        const k = amount * 180;
        const n = 22050;
        const curve = new Float32Array(n);
        const deg = Math.PI / 180;
        for (let i = 0; i < n; i++) {
          const x = (i * 2) / n - 1;
          curve[i] = k === 0 ? x : ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
        }
        return curve;
      }

      function createImpulseResponse(ctx, duration = 1.6, decay = 2.4) {
        const len = Math.floor(ctx.sampleRate * duration);
        const imp = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const data = imp.getChannelData(ch);
          for (let i = 0; i < len; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
          }
        }
        return imp;
      }

      function ensureAudio() {
        if (!audioCtx) {
          const C = window.AudioContext || window.webkitAudioContext;
          audioCtx = new C();

          bassFilter = audioCtx.createBiquadFilter();
          bassFilter.type = 'lowshelf';
          bassFilter.frequency.value = 140;
          bassFilter.gain.value = fxBassGain;

          shaperNode = audioCtx.createWaveShaper();
          shaperNode.curve = makeDistortionCurve(fxDistortion);
          shaperNode.oversample = '2x';

          masterGain = audioCtx.createGain();
          masterGain.gain.value = masterVolume;

          delayNode = audioCtx.createDelay(1.0);
          delayNode.delayTime.value = 0.28;
          const fb = audioCtx.createGain();
          fb.gain.value = 0.34;
          delayGain = audioCtx.createGain();
          delayGain.gain.value = fxDelayWet;
          delayNode.connect(fb);
          fb.connect(delayNode);
          delayNode.connect(delayGain);
          delayGain.connect(bassFilter);

          reverbNode = audioCtx.createConvolver();
          reverbNode.buffer = createImpulseResponse(audioCtx, 1.7, 2.5);
          reverbGain = audioCtx.createGain();
          reverbGain.gain.value = fxReverbWet;
          reverbNode.connect(reverbGain);
          reverbGain.connect(bassFilter);

          bassFilter.connect(shaperNode);
          shaperNode.connect(masterGain);

          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 128;
          masterGain.connect(analyser);
          analyser.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function triggerChannelVoice(ctx, destNode, sendDelay, sendReverb, ch, midi = 60, time = ctx.currentTime, dur = 0.22) {
        if (ch.muted) return;
        const chGain = ctx.createGain();
        chGain.gain.setValueAtTime(ch.volume, time);

        let outTarget = chGain;
        if (ctx.createStereoPanner) {
          const panner = ctx.createStereoPanner();
          panner.pan.setValueAtTime(ch.pan || 0, time);
          chGain.connect(panner);
          outTarget = panner;
        }
        outTarget.connect(destNode);
        if (sendDelay && ch.engine === 'synth') outTarget.connect(sendDelay);
        if (sendReverb) outTarget.connect(sendReverb);

        if (ch.engine === 'sample' && importedBuffers.has(ch.id)) {
          const src = ctx.createBufferSource();
          src.buffer = importedBuffers.get(ch.id);
          src.playbackRate.setValueAtTime(Math.pow(2, (midi - 60) / 12), time);
          src.connect(chGain);
          src.start(time);
          return;
        }

        if (ch.engine === 'drum') {
          if (ch.preset === 'kick808' || ch.preset === 'kickPunch' || ch.preset === 'tom') {
            const osc = ctx.createOscillator();
            const env = ctx.createGain();
            osc.type = 'sine';
            const startF = ch.preset === 'kick808' ? 145 : ch.preset === 'tom' ? 240 : 185;
            const endF = ch.preset === 'kick808' ? 38 : ch.preset === 'tom' ? 95 : 48;
            const dec = ch.decay || 0.35;
            osc.frequency.setValueAtTime(startF, time);
            osc.frequency.exponentialRampToValueAtTime(endF, time + dec * 0.72);
            env.gain.setValueAtTime(1.0, time);
            env.gain.exponentialRampToValueAtTime(0.001, time + dec);
            osc.connect(env);
            env.connect(chGain);
            osc.start(time);
            osc.stop(time + dec + 0.02);
          } else if (ch.preset === 'laser') {
            const osc = ctx.createOscillator();
            const env = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(1400, time);
            osc.frequency.exponentialRampToValueAtTime(110, time + 0.2);
            env.gain.setValueAtTime(0.65, time);
            env.gain.exponentialRampToValueAtTime(0.001, time + 0.22);
            osc.connect(env);
            env.connect(chGain);
            osc.start(time);
            osc.stop(time + 0.24);
          } else if (ch.preset === 'cowbell') {
            [540, 800].forEach(freq => {
              const osc = ctx.createOscillator();
              const env = ctx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(freq, time);
              env.gain.setValueAtTime(0.35, time);
              env.gain.exponentialRampToValueAtTime(0.001, time + 0.16);
              osc.connect(env);
              env.connect(chGain);
              osc.start(time);
              osc.stop(time + 0.17);
            });
          } else if (ch.preset === 'snare' || ch.preset === 'clap' || ch.preset === 'rim') {
            const dec = ch.decay || 0.2;
            const len = Math.floor(ctx.sampleRate * dec);
            const buf = ctx.createBuffer(1, len, ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
            const noise = ctx.createBufferSource();
            noise.buffer = buf;

            const filt = ctx.createBiquadFilter();
            filt.type = ch.preset === 'clap' ? 'bandpass' : 'highpass';
            filt.frequency.setValueAtTime(ch.preset === 'clap' ? 1400 : 950, time);

            const env = ctx.createGain();
            env.gain.setValueAtTime(0.85, time);
            env.gain.exponentialRampToValueAtTime(0.001, time + dec);
            noise.connect(filt);
            filt.connect(env);
            env.connect(chGain);
            noise.start(time);

            if (ch.preset === 'snare' || ch.preset === 'rim') {
              const body = ctx.createOscillator();
              const bEnv = ctx.createGain();
              body.type = 'triangle';
              body.frequency.setValueAtTime(ch.preset === 'rim' ? 420 : 195, time);
              body.frequency.exponentialRampToValueAtTime(95, time + 0.1);
              bEnv.gain.setValueAtTime(0.65, time);
              bEnv.gain.exponentialRampToValueAtTime(0.001, time + 0.11);
              body.connect(bEnv);
              bEnv.connect(chGain);
              body.start(time);
              body.stop(time + 0.12);
            }
          } else {
            const dec = ch.decay || 0.07;
            const len = Math.floor(ctx.sampleRate * dec);
            const buf = ctx.createBuffer(1, len, ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
            const noise = ctx.createBufferSource();
            noise.buffer = buf;

            const hp = ctx.createBiquadFilter();
            hp.type = 'highpass';
            hp.frequency.setValueAtTime(ch.cutoff || 7200, time);

            const env = ctx.createGain();
            env.gain.setValueAtTime(0.55, time);
            env.gain.exponentialRampToValueAtTime(0.001, time + dec);
            noise.connect(hp);
            hp.connect(env);
            env.connect(chGain);
            noise.start(time);
          }
          return;
        }

        const osc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();
        const env = ctx.createGain();

        osc.type = ch.wave || 'sawtooth';
        osc.frequency.setValueAtTime(midiToFreq(midi), time);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(ch.cutoff || 2400, time);
        filter.Q.setValueAtTime(2.6, time);

        const a = Math.max(0.002, ch.attack || 0.01);
        const d = Math.max(0.02, ch.decay || 0.18);
        const s = Math.max(0.01, ch.sustain ?? 0.45);
        const r = Math.max(0.02, ch.release || 0.15);

        env.gain.setValueAtTime(0.001, time);
        env.gain.linearRampToValueAtTime(0.65, time + a);
        env.gain.exponentialRampToValueAtTime(Math.max(0.01, 0.65 * s), time + a + d);
        env.gain.setValueAtTime(Math.max(0.01, 0.65 * s), time + dur);
        env.gain.exponentialRampToValueAtTime(0.001, time + dur + r);

        osc.connect(filter);
        filter.connect(env);
        env.connect(chGain);

        osc.start(time);
        osc.stop(time + dur + r + 0.02);
      }

      // =========================================================================
      // SEQUENCER CLOCK
      // =========================================================================
      let stepTimer = null;

      function getStepDurationSec() {
        return (60 / bpm) / 4;
      }

      function playStepEvents(patIdx, stepIdx, time = null) {
        const ctx = ensureAudio();
        const when = time !== null ? time : ctx.currentTime;
        const pat = patterns[patIdx];
        if (!pat) return;

        const stepDur = getStepDurationSec();
        channels.forEach(ch => {
          const chData = pat.data[ch.uid];
          if (!chData) return;
          if (chData.steps[stepIdx]) {
            triggerChannelVoice(ctx, bassFilter, delayNode, reverbNode, ch, 60, when, stepDur * 0.9);
          }
          if (chData.notes && chData.notes.length > 0) {
            chData.notes.forEach(n => {
              if (n.step === stepIdx) {
                triggerChannelVoice(ctx, bassFilter, delayNode, reverbNode, ch, n.midi, when, stepDur * 1.4);
              }
            });
          }
        });
      }

      function tickSequencer() {
        if (!isPlaying) return;
        if (playMode === 'pat') {
          playStepEvents(activePatternIdx, currentStep);
        } else {
          const activePats = new Set();
          playlist.forEach(row => {
            const pIdx = row[currentBar];
            if (pIdx !== null && pIdx !== undefined) activePats.add(pIdx);
          });
          activePats.forEach(pIdx => playStepEvents(pIdx, currentStep));
        }

        updatePlayheadUI();
        currentStep++;
        if (currentStep >= 16) {
          currentStep = 0;
          if (playMode === 'song') {
            currentBar = (currentBar + 1) % 16;
          }
        }
      }

      function startPlayback() {
        ensureAudio();
        if (isPlaying) return;
        isPlaying = true;
        document.getElementById('playBtn').classList.add('active-play');
        document.getElementById('playBtn').textContent = '❚❚';
        tickSequencer();
        stepTimer = setInterval(tickSequencer, getStepDurationSec() * 1000);
      }

      function stopPlayback() {
        isPlaying = false;
        clearInterval(stepTimer);
        currentStep = 0;
        currentBar = 0;
        document.getElementById('playBtn').classList.remove('active-play');
        document.getElementById('playBtn').textContent = '▶';
        updatePlayheadUI();
      }

      function restartClockIfPlaying() {
        if (!isPlaying) return;
        clearInterval(stepTimer);
        stepTimer = setInterval(tickSequencer, getStepDurationSec() * 1000);
      }

      function updatePlayheadUI() {
        const barNum = playMode === 'song' ? currentBar + 1 : activePatternIdx + 1;
        document.getElementById('posLcd').textContent =
          `${String(barNum).padStart(2, '0')}:${String(currentStep + 1).padStart(2, '0')}`;

        document.querySelectorAll('.step-pad.now').forEach(el => el.classList.remove('now'));
        document.querySelectorAll('.pr-slot.now').forEach(el => el.classList.remove('now'));
        document.querySelectorAll('.bar-slot.now').forEach(el => el.classList.remove('now'));

        if (isPlaying) {
          document.querySelectorAll(`.step-pad[data-step="${currentStep}"]`).forEach(el => el.classList.add('now'));
          document.querySelectorAll(`.pr-slot[data-step="${currentStep}"]`).forEach(el => el.classList.add('now'));
          if (playMode === 'song') {
            document.querySelectorAll(`.bar-slot[data-bar="${currentBar}"]`).forEach(el => el.classList.add('now'));
          }
        }
      }

      // =========================================================================
      // MULTI-FORMAT AUDIO EXPORTER (WAV, MP3, OGG/WEBM, AIFF + QUALITY %)
      // =========================================================================
      function qualityToBitrateKbps(pct) {
        return Math.round(32 + (pct / 100) * 288); // 32 kbps .. 320 kbps
      }

      function qualityToSampleRate(pct) {
        if (pct < 25) return 16000;
        if (pct < 50) return 22050;
        if (pct < 80) return 32000;
        return 44100;
      }

      function updateQualityBadge() {
        const pct = Math.max(1, Math.min(100, Number(document.getElementById('qualityNumber').value) || 85));
        document.getElementById('qualityNumber').value = pct;
        document.getElementById('qualityRange').value = pct;
        const kbps = qualityToBitrateKbps(pct);
        const sr = qualityToSampleRate(pct);
        const tier = pct >= 80 ? 'Wysoka' : pct >= 45 ? 'Średnia' : 'Mocna kompresja';
        document.getElementById('qualityPctBadge').textContent = `${pct}% (${tier} · ~${kbps} kbps / ${(sr / 1000).toFixed(1)} kHz)`;
      }

      async function renderOfflineAudioBuffer(scopeMode, targetSampleRate) {
        const stepDur = getStepDurationSec();
        const totalBars = scopeMode === 'song' ? 16 : 2;
        const totalSteps = totalBars * 16;
        const durationSec = totalSteps * stepDur + 0.8;

        const offline = new OfflineAudioContext(2, Math.ceil(targetSampleRate * durationSec), targetSampleRate);
        const outBass = offline.createBiquadFilter();
        outBass.type = 'lowshelf';
        outBass.frequency.value = 140;
        outBass.gain.value = fxBassGain;

        const outShaper = offline.createWaveShaper();
        outShaper.curve = makeDistortionCurve(fxDistortion);

        const outGain = offline.createGain();
        outGain.gain.value = masterVolume;

        outBass.connect(outShaper);
        outShaper.connect(outGain);
        outGain.connect(offline.destination);

        for (let b = 0; b < totalBars; b++) {
          for (let s = 0; s < 16; s++) {
            const time = (b * 16 + s) * stepDur;
            const patsToPlay = scopeMode === 'pat'
              ? [activePatternIdx]
              : [...new Set(playlist.map(r => r[b]).filter(v => v !== null && v !== undefined))];

            patsToPlay.forEach(pIdx => {
              const pat = patterns[pIdx];
              if (!pat) return;
              channels.forEach(ch => {
                const chData = pat.data[ch.uid];
                if (!chData) return;
                if (chData.steps[s]) {
                  triggerChannelVoice(offline, outBass, null, null, ch, 60, time, stepDur * 0.9);
                }
                if (chData.notes) {
                  chData.notes.forEach(n => {
                    if (n.step === s) {
                      triggerChannelVoice(offline, outBass, null, null, ch, n.midi, time, stepDur * 1.4);
                    }
                  });
                }
              });
            });
          }
        }
        return await offline.startRendering();
      }

      function encodeWavBlob(buffer, qualityPct) {
        const bitDepth = qualityPct >= 40 ? 16 : 8;
        const bytesPerSample = bitDepth / 8;
        const numCh = buffer.numberOfChannels;
        const dataLen = buffer.length * numCh * bytesPerSample;
        const totalLen = dataLen + 44;
        const ab = new ArrayBuffer(totalLen);
        const view = new DataView(ab);
        const chData = [buffer.getChannelData(0), buffer.getChannelData(1)];

        const writeStr = (off, str) => {
          for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
        };

        writeStr(0, 'RIFF');
        view.setUint32(4, totalLen - 8, true);
        writeStr(8, 'WAVE');
        writeStr(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numCh, true);
        view.setUint32(24, buffer.sampleRate, true);
        view.setUint32(28, buffer.sampleRate * numCh * bytesPerSample, true);
        view.setUint16(32, numCh * bytesPerSample, true);
        view.setUint16(34, bitDepth, true);
        writeStr(36, 'data');
        view.setUint32(40, dataLen, true);

        let pos = 44;
        for (let i = 0; i < buffer.length; i++) {
          for (let c = 0; c < numCh; c++) {
            const s = Math.max(-1, Math.min(1, chData[c][i]));
            if (bitDepth === 16) {
              view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
              pos += 2;
            } else {
              view.setUint8(pos, Math.round((s + 1) * 127.5));
              pos += 1;
            }
          }
        }
        return new Blob([ab], { type: 'audio/wav' });
      }

      function encodeAiffBlob(buffer) {
        const numCh = buffer.numberOfChannels;
        const numFrames = buffer.length;
        const dataSize = numFrames * numCh * 2;
        const totalLen = 54 + dataSize;
        const ab = new ArrayBuffer(totalLen);
        const view = new DataView(ab);
        const chData = [buffer.getChannelData(0), buffer.getChannelData(1)];

        const writeStr = (off, str) => {
          for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
        };

        writeStr(0, 'FORM');
        view.setUint32(4, totalLen - 8, false);
        writeStr(8, 'AIFF');
        writeStr(12, 'COMM');
        view.setUint32(16, 18, false);
        view.setInt16(20, numCh, false);
        view.setUint32(22, numFrames, false);
        view.setInt16(26, 16, false);
        // 80-bit IEEE 754 sample rate (44100 -> 0x400E 0xAC44000000000000)
        view.setUint16(28, 0x400E, false);
        view.setUint32(30, (buffer.sampleRate << 16) >>> 0, false);
        view.setUint32(34, 0, false);

        writeStr(38, 'SSND');
        view.setUint32(42, dataSize + 8, false);
        view.setUint32(46, 0, false);
        view.setUint32(50, 0, false);

        let pos = 54;
        for (let i = 0; i < numFrames; i++) {
          for (let c = 0; c < numCh; c++) {
            const s = Math.max(-1, Math.min(1, chData[c][i]));
            view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, false);
            pos += 2;
          }
        }
        return new Blob([ab], { type: 'audio/aiff' });
      }

      async function encodeCompressedBlob(buffer, format, qualityPct) {
        const bps = qualityToBitrateKbps(qualityPct) * 1000;
        const mimeCandidates = format === 'mp3'
          ? ['audio/mpeg', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm']
          : ['audio/ogg;codecs=opus', 'audio/webm;codecs=opus', 'audio/webm'];

        const supportedMime = (typeof MediaRecorder !== 'undefined')
          ? mimeCandidates.find(m => MediaRecorder.isTypeSupported(m))
          : null;

        if (!supportedMime) {
          // Fallback to compressed-rate WAV packaged with requested extension if browser lacks MediaRecorder codec
          return encodeWavBlob(buffer, qualityPct);
        }

        const ctx = ensureAudio();
        const dest = ctx.createMediaStreamDestination();
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        src.connect(dest);

        const chunks = [];
        const recorder = new MediaRecorder(dest.stream, { mimeType: supportedMime, audioBitsPerSecond: bps });
        recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

        const done = new Promise(resolve => {
          recorder.onstop = () => resolve(new Blob(chunks, { type: supportedMime }));
        });

        recorder.start();
        src.start();
        src.onended = () => {
          if (recorder.state !== 'inactive') recorder.stop();
        };
        return await done;
      }

      async function handleAudioExport() {
        const format = document.getElementById('exportFormatSelect').value;
        const qualityPct = Math.max(1, Math.min(100, Number(document.getElementById('qualityNumber').value) || 85));
        const rawName = (document.getElementById('exportFileName').value || 'FruityWeb_Track').trim();
        const scopeSel = document.getElementById('exportScopeSelect').value;
        const scopeMode = scopeSel === 'current' ? playMode : scopeSel;
        const prog = document.getElementById('exportProgressText');

        prog.textContent = `Renderowanie ${format.toUpperCase()} (${qualityPct}% jakości)...`;
        const targetSr = (format === 'aiff') ? 44100 : qualityToSampleRate(qualityPct);
        const renderedBuffer = await renderOfflineAudioBuffer(scopeMode, targetSr);

        let blob;
        if (format === 'wav') {
          blob = encodeWavBlob(renderedBuffer, qualityPct);
        } else if (format === 'aiff') {
          blob = encodeAiffBlob(renderedBuffer);
        } else {
          blob = await encodeCompressedBlob(renderedBuffer, format, qualityPct);
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${rawName}_${qualityPct}pct.${format}`;
        a.click();
        URL.revokeObjectURL(url);

        prog.textContent = `Gotowe! Pobrano ${rawName}_${qualityPct}pct.${format}`;
        document.getElementById('statusBanner').textContent = `WYEKSPORTOWANO .${format.toUpperCase()}`;
      }

      function renderBrowser() {
        const query = (document.getElementById('libSearch').value || '').toLowerCase().trim();
        const tree = document.getElementById('browserTree');
        tree.innerHTML = libraries.map((lib, fIdx) => {
          const filtered = lib.items.filter(it => it.name.toLowerCase().includes(query));
          if (query && filtered.length === 0) return '';
          return `
            <div class="folder-box">
              <div class="folder-head">
                <span>${lib.folder}</span>
                <span>(${filtered.length})</span>
              </div>
              <div class="folder-list">
                ${filtered.length === 0
                  ? `<div style="padding:4px 6px; color:#64748b; font-size:10px;">Brak elementów (kliknij 📥 Sample)</div>`
                  : filtered.map(item => `
                    <div class="sample-row" data-id="${item.id}">
                      <span style="display:flex; align-items:center; gap:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                        <span style="width:7px; height:7px; border-radius:50%; background:${item.color}; flex-shrink:0;"></span>
                        <span>${item.name}</span>
                      </span>
                      <button type="button" class="add-btn" data-add="${item.id}">+CH</button>
                    </div>
                  `).join('')}
              </div>
            </div>
          `;
        }).join('');

        tree.querySelectorAll('.sample-row').forEach(el => {
          el.addEventListener('click', (e) => {
            if (e.target.closest('[data-add]')) return;
            const item = findLibraryItemById(el.dataset.id);
            if (!item) return;
            const ctx = ensureAudio();
            triggerChannelVoice(ctx, bassFilter, null, null, { ...item, volume: 0.85, pan: 0, muted: false }, 60);
          });
        });

        tree.querySelectorAll('[data-add]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const item = findLibraryItemById(btn.dataset.add);
            if (!item) return;
            const newUid = 'ch_' + Date.now().toString(36) + Math.floor(Math.random() * 99);
            channels.push({ ...item, uid: newUid, volume: 0.85, pan: 0, muted: false });
            patterns.forEach(p => { p.data[newUid] = { steps: Array(16).fill(false), notes: [] }; });
            selectedChannelIdx = channels.length - 1;
            renderAll();
          });
        });
      }

      function findLibraryItemById(id) {
        for (const lib of libraries) {
          const found = lib.items.find(it => it.id === id);
          if (found) return found;
        }
        return null;
      }

            <div class="ch-strip ${cIdx === selectedChannelIdx ? 'selected' : ''}">

      function renderPianoRoll() {
        const ch = channels[selectedChannelIdx] || channels[0];
        if (!ch) return;
        document.getElementById('prChannelTitle').textContent = `Piano Roll · ${ch.name} (${patterns[activePatternIdx].name})`;

        const keysEl = document.getElementById('pianoKeys');
        const gridEl = document.getElementById('prGrid');
        const chData = patterns[activePatternIdx].data[ch.uid];

        keysEl.innerHTML = NOTES.map(n => `
          <div class="piano-key ${n.sharp ? 'black' : 'white'}" data-midi="${n.midi}">${n.name}</div>
        `).join('');

        gridEl.innerHTML = NOTES.map(n => `
          <div class="pr-note-row ${n.sharp ? 'sharp-row' : ''}">
            ${Array.from({ length: 16 }, (_, step) => {
              const active = chData.notes.some(item => item.step === step && item.midi === n.midi);
              return `<div class="pr-slot ${active ? 'active' : ''}" data-step="${step}" data-midi="${n.midi}"></div>`;
            }).join('')}
          </div>
        `).join('');

        keysEl.querySelectorAll('.piano-key').forEach(k => {
          k.addEventListener('pointerdown', () => {
            const ctx = ensureAudio();
            triggerChannelVoice(ctx, bassFilter, null, null, ch, Number(k.dataset.midi), ctx.currentTime, 0.25);
          });
        });

        gridEl.querySelectorAll('.pr-slot').forEach(cell => {
          cell.addEventListener('click', () => {
            const step = Number(cell.dataset.step);
            const midi = Number(cell.dataset.midi);
            const existingIdx = chData.notes.findIndex(item => item.step === step && item.midi === midi);

              cell.classList.remove('active');

              chData.notes.push({ step, midi });
              cell.classList.add('active');
              const ctx = ensureAudio();
              triggerChannelVoice(ctx, bassFilter, null, null, ch, midi, ctx.currentTime, 0.22);
            }
            renderChannelRack();
          });
        });

            <div class="fader-col">

        const kbd = document.getElementById('miniKbd');

        kbd.querySelectorAll('.live-key').forEach(btn => {

      function switchView(viewName) {
        activeView = viewName;
        document.querySelectorAll('.view-pill').forEach(t => t.classList.toggle('active', t.dataset.view === viewName));

        document.getElementById(`view-${viewName}`).classList.add('active');
        if (viewName === 'pianoroll') renderPianoRoll();
        if (viewName === 'playlist') renderPlaylist();
      }

      function switchMobileTab(tabName) {
        document.querySelectorAll('.mob-tab').forEach(b => b.classList.toggle('active', b.dataset.mob === tabName));
        const pBrowser = document.getElementById('paneBrowser');
        const pCenter = document.getElementById('paneCenter');
        const pInsp = document.getElementById('paneInspector');

        pBrowser.classList.remove('mobile-active');
        pCenter.classList.remove('mobile-active');
        pInsp.classList.remove('mobile-active');

        if (tabName === 'browser') {
          pBrowser.classList.add('mobile-active');
        } else if (tabName === 'inspector') {
          pInsp.classList.add('mobile-active');
        } else {
          pCenter.classList.add('mobile-active');
          switchView(tabName);
        }
      }

      function renderAll() {
        renderBrowser();
        renderPatternsBar();
        renderChannelRack();
        if (activeView === 'pianoroll') renderPianoRoll();
        if (activeView === 'playlist') renderPlaylist();
        renderSynthInspector();
        renderMixer();
      }

      // Oscilloscope & Master VU Animation
      const scopeCanvas = document.getElementById('scopeCanvas');
      const sctx = scopeCanvas.getContext('2d');
      function animateVisuals() {
        const masterVu = document.getElementById('masterVu');
        sctx.fillStyle = '#07090d';
        sctx.fillRect(0, 0, scopeCanvas.width, scopeCanvas.height);

        if (analyser && isPlaying) {
          const freqData = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteFrequencyData(freqData);
          const avg = freqData.reduce((a, b) => a + b, 0) / freqData.length;
          if (masterVu) masterVu.style.height = `${Math.min(100, Math.round((avg / 170) * 100))}%`;

          const barW = scopeCanvas.width / 24;
          for (let i = 0; i < 24; i++) {
            const h = (freqData[i] / 255) * scopeCanvas.height;
            sctx.fillStyle = i > 16 ? '#38bdf8' : '#ff7b00';
            sctx.fillRect(i * barW, scopeCanvas.height - h, barW - 1, h);
          }
        } else {
          if (masterVu) masterVu.style.height = '0%';
          sctx.strokeStyle = '#334155';
          sctx.beginPath();
          sctx.moveTo(0, scopeCanvas.height / 2);
          sctx.lineTo(scopeCanvas.width, scopeCanvas.height / 2);
          sctx.stroke();
        }
        requestAnimationFrame(animateVisuals);
      }

      // =========================================================================
      // DLC / EXPANSION PACK REGISTRATION API (Wywoływane na dole pliku HTML)
      // =========================================================================
      window.registerFruityDlc = function(pack) {
        if (!pack || !pack.folder || !Array.isArray(pack.items)) return;
        const existing = libraries.find(l => l.folder === pack.folder);
        if (existing) {
          pack.items.forEach(it => {
            if (!existing.items.some(x => x.id === it.id)) existing.items.push(it);
          });
        } else {
          libraries.splice(libraries.length - 1, 0, pack);
        }
        renderBrowser();
      };

      // =========================================================================
      // IMPORT / EXPORT HANDLERS
      // =========================================================================
      document.getElementById('importAudioBtn').addEventListener('click', () => {
        document.getElementById('audioFileInput').click();
      });

      document.getElementById('audioFileInput').addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const ctx = ensureAudio();
        const arrayBuf = await file.arrayBuffer();
        const audioBuf = await ctx.decodeAudioData(arrayBuf.slice(0));

        const reader = new FileReader();
        reader.onload = () => {
          const sampleId = 'smp_' + Date.now().toString(36);
          const cleanName = file.name.replace(/\.[^/.]+$/, '').slice(0, 22);
          importedBuffers.set(sampleId, audioBuf);
          importedDataUrls.set(sampleId, reader.result);

          const sampleDef = {
            id: sampleId,
            name: cleanName,
            color: '#38bdf8',
            engine: 'sample',
            preset: 'sample',
            wave: 'sine',
            cutoff: 8000,
            attack: 0.005,
            decay: 0.3,
            sustain: 0.8,
            release: 0.1
          };
          libraries[libraries.length - 1].items.push(sampleDef);

          const newUid = 'ch_' + Date.now().toString(36);
          channels.push({ ...sampleDef, uid: newUid, volume: 0.9, pan: 0, muted: false });
          patterns.forEach(p => { p.data[newUid] = { steps: Array(16).fill(false), notes: [] }; });
          selectedChannelIdx = channels.length - 1;
          document.getElementById('statusBanner').textContent = `DODANO: ${cleanName}`;
          renderAll();
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      });

      document.getElementById('saveProjBtn').addEventListener('click', () => {
        const payload = {
          version: 2,
          bpm,
          masterVolume,
          fxDistortion,
          fxReverbWet,
          fxDelayWet,
          fxBassGain,
          channels,
          patterns,
          playlist,
          libraries,
          samplesBase64: Object.fromEntries(importedDataUrls.entries())
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `FruityWeb26_Project_${bpm}BPM.json`;
        a.click();
        URL.revokeObjectURL(url);
        document.getElementById('statusBanner').textContent = 'PROJEKT ZAPISANY';
      });

      document.getElementById('exportLibBtn').addEventListener('click', () => {
        const payload = {
          type: 'FruityWeb_SoundLibrary',
          libraries,
          samplesBase64: Object.fromEntries(importedDataUrls.entries())
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'FruityWeb26_Library.json';
        a.click();
        URL.revokeObjectURL(url);
        document.getElementById('statusBanner').textContent = 'BIBLIOTEKA WYEKSPORTOWANA';
      });

      document.getElementById('importProjBtn').addEventListener('click', () => {
        document.getElementById('projFileInput').click();
      });

      document.getElementById('projFileInput').addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          const ctx = ensureAudio();

          if (data.samplesBase64) {
            for (const [id, dataUrl] of Object.entries(data.samplesBase64)) {
              const res = await fetch(dataUrl);
              const ab = await res.arrayBuffer();
              const decoded = await ctx.decodeAudioData(ab);
              importedBuffers.set(id, decoded);
              importedDataUrls.set(id, dataUrl);
            }
          }

          if (data.type === 'FruityWeb_SoundLibrary' && data.libraries) {
            libraries = data.libraries;
            document.getElementById('statusBanner').textContent = 'BIBLIOTEKA WCZYTANA!';
            renderBrowser();
          } else if (data.channels && data.patterns) {
            stopPlayback();
            bpm = data.bpm || 128;
            document.getElementById('bpmInput').value = bpm;
            masterVolume = data.masterVolume ?? 0.85;
            channels = data.channels;
            patterns = data.patterns;
            playlist = data.playlist || playlist;
            if (data.libraries) libraries = data.libraries;
            activePatternIdx = 0;
            selectedChannelIdx = 0;
            document.getElementById('statusBanner').textContent = 'PROJEKT WCZYTANY!';
            renderAll();
          }
        } catch {
          document.getElementById('statusBanner').textContent = 'BŁĄD PLIKU JSON';
        }
        e.target.value = '';
      });

      document.getElementById('addPatternBtn').addEventListener('click', () => {
        patterns.push(createBlankPattern(`Pattern ${patterns.length + 1}`));

        renderAll();
      });

      document.getElementById('clearPatternBtn').addEventListener('click', () => {
        const pat = patterns[activePatternIdx];
        channels.forEach(ch => { pat.data[ch.uid] = { steps: Array(16).fill(false), notes: [] }; });

      document.getElementById('fxDistSlider').addEventListener('input', e => {
        fxDistortion = Number(e.target.value);

      });
      document.getElementById('fxDelaySlider').addEventListener('input', e => {
        fxDelayWet = Number(e.target.value);
        if (delayGain) delayGain.gain.value = fxDelayWet;
        document.getElementById('delayValLbl').textContent = `${Math.round((fxDelayWet / 0.65) * 100)}%`;
      });
      document.getElementById('fxBassSlider').addEventListener('input', e => {
        fxBassGain = Number(e.target.value);
        if (bassFilter) bassFilter.gain.value = fxBassGain;
        document.getElementById('bassValLbl').textContent = `${fxBassGain >= 0 ? '+' : ''}${fxBassGain} dB`;
      });

      document.getElementById('libSearch').addEventListener('input', renderBrowser);

      document.querySelectorAll('.view-pill').forEach(tab => {
        tab.addEventListener('click', () => switchView(tab.dataset.view));
      });
      document.querySelectorAll('.mob-tab').forEach(tab => {
        tab.addEventListener('click', () => switchMobileTab(tab.dataset.mob));
      });

      window.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space') {
          e.preventDefault();
          if (isPlaying) stopPlayback();
          else startPlayback();
        }
      });

      renderMiniKeyboard();
      renderAll();
      requestAnimationFrame(animateVisuals);
    })();
  </script>
