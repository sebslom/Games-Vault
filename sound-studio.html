<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FruityWeb Studio 26 · DAW &amp; Synth Workstation</title>
  <style>
    :root {
      --bg-app: #14171c;
      --bg-panel: #1d222a;
      --bg-header: #252b35;
      --bg-dark: #101318;
      --bg-slot: #2b323e;
      --border: #363f4e;
      --border-light: #485366;
      --fl-orange: #ff7b00;
      --fl-green: #22c55e;
      --fl-cyan: #38bdf8;
      --fl-red: #ef4444;
      --fl-yellow: #facc15;
      --fl-purple: #a855f7;
      --step-off-a: #3b4252;
      --step-off-b: #2e3440;
      --step-on-a: #ff8c1a;
      --step-on-b: #e11d48;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-app);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 12px;
    }

    .daw-shell {
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg-app);
    }

    /* --- TOP TRANSPORT & MENU BAR (FL STUDIO STYLE) --- */
    .transport-bar {
      height: 52px;
      background: linear-gradient(180deg, #2b313c 0%, #1e232b 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      padding-right: 48px;
      gap: 10px;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .fl-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #13161c;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 9px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: var(--fl-orange);
    }
    .fl-logo span { color: #f8fafc; font-weight: 700; }

    .menu-actions {
      display: flex;
      gap: 4px;
    }
    .menu-btn {
      background: var(--bg-slot);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 5px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .menu-btn:hover { border-color: var(--fl-orange); color: #fff; }
    .menu-btn.export-wav {
      background: rgba(34, 197, 94, 0.16);
      border-color: var(--fl-green);
      color: #86efac;
    }

    .transport-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #12151b;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
    }

    .mode-toggle {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-right: 4px;
    }
    .mode-pill {
      font-size: 9px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid #333c4a;
      background: #1d222a;
      color: var(--muted);
      cursor: pointer;
    }
    .mode-pill.active.pat { background: var(--fl-orange); color: #000; border-color: var(--fl-orange); }
    .mode-pill.active.song { background: var(--fl-green); color: #000; border-color: var(--fl-green); }

    .t-btn {
      width: 32px;
      height: 30px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: #252b36;
      color: var(--text);
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .t-btn:hover { border-color: var(--fl-cyan); }
    .t-btn.playing {
      background: var(--fl-green);
      color: #05180c;
      border-color: #86efac;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
    }

    .lcd-display {
      background: #090c10;
      border: 1px inset #384152;
      border-radius: 5px;
      padding: 3px 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
    }
    .lcd-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .lcd-lbl { font-size: 8px; color: #64748b; font-weight: 800; letter-spacing: 0.7px; }
    .lcd-val { font-size: 13px; font-weight: 900; color: var(--fl-orange); }
    .lcd-val.time { color: var(--fl-green); }

    .bpm-input {
      width: 48px;
      background: #0d1117;
      border: 1px solid #333d4f;
      color: var(--fl-orange);
      font-family: inherit;
      font-weight: 900;
      font-size: 13px;
      text-align: center;
      border-radius: 3px;
      padding: 1px 2px;
    }

    .view-tabs {
      display: flex;
      gap: 4px;
    }
    .v-tab {
      background: #1a1f27;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .v-tab.active {
      background: #333c4d;
      color: var(--fl-orange);
      border-color: var(--fl-orange);
    }

    /* --- MAIN WORKSPACE GRID --- */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 235px 1fr 290px;
      overflow: hidden;
    }

    /* LEFT: SOUND & PRESET BROWSER */
    .browser-pane {
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pane-header {
      height: 30px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      color: #cbd5e1;
      letter-spacing: 0.4px;
      flex-shrink: 0;
    }

    .browser-tools {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 5px;
    }
    .browser-search {
      flex: 1;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 7px;
      color: var(--text);
      font-size: 11px;
      outline: none;
    }

    .browser-tree {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lib-folder {
      background: #161a21;
      border: 1px solid #2a313d;
      border-radius: 6px;
      overflow: hidden;
    }
    .lib-folder-title {
      background: #222833;
      padding: 5px 8px;
      font-weight: 800;
      font-size: 11px;
      color: var(--fl-orange);
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }
    .lib-items {
      display: flex;
      flex-direction: column;
      padding: 3px;
      gap: 2px;
    }
    .lib-item {
      padding: 4px 7px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-size: 11px;
      color: #e2e8f0;
      cursor: pointer;
    }
    .lib-item:hover { background: #2c3442; }
    .lib-item .add-ch-btn {
      background: #333d4f;
      border: none;
      color: var(--fl-cyan);
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }
    .lib-item .add-ch-btn:hover { background: var(--fl-cyan); color: #000; }

    /* CENTER: CHANNEL RACK + PIANO ROLL + PLAYLIST */
    .center-pane {
      display: flex;
      flex-direction: column;
      background: #161920;
      overflow: hidden;
    }

    .sub-window {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }
    .sub-window.active { display: flex; }

    /* Pattern Selector Bar */
    .pattern-bar {
      background: #1d222b;
      border-bottom: 1px solid var(--border);
      padding: 5px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pat-pills {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .pat-btn {
      background: #272e3a;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .pat-btn.active {
      background: var(--fl-orange);
      color: #090c10;
      border-color: #fdba74;
    }

    /* Channel Rack Rows */
    .rack-scroll {
      flex: 1;
      overflow: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .channel-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #212731;
      border: 1px solid #303846;
      border-radius: 6px;
      padding: 4px 6px;
      min-width: max-content;
    }
    .channel-row.selected-ch {
      border-color: var(--fl-orange);
      box-shadow: 0 0 0 1px rgba(255, 123, 0, 0.35);
    }

    .mute-led {
      width: 12px;
      height: 24px;
      border-radius: 3px;
      border: 1px solid #111;
      background: var(--fl-green);
      cursor: pointer;
    }
    .mute-led.muted { background: #334155; }

    .ch-knob {
      width: 34px;
      accent-color: var(--fl-orange);
      cursor: pointer;
    }

    .ch-name-btn {
      width: 126px;
      height: 28px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.14);
      background: #2d3543;
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      padding: 0 8px;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
    }
    .ch-name-btn .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .steps-grid {
      display: flex;
      gap: 3px;
      align-items: center;
    }
    .step-cell {
      width: 22px;
      height: 28px;
      border-radius: 4px;
      border: 1px solid #181c24;
      cursor: pointer;
      position: relative;
    }
    .step-cell.beat-a { background: var(--step-off-a); }
    .step-cell.beat-b { background: var(--step-off-b); }
    .step-cell.on.beat-a { background: var(--step-on-a); border-color: #fed7aa; }
    .step-cell.on.beat-b { background: var(--step-on-b); border-color: #fecdd3; }
    .step-cell.playhead {
      outline: 2px solid #ffffff;
      box-shadow: 0 0 10px #ffffff;
      z-index: 2;
    }
    .step-cell:nth-child(4n) { margin-right: 5px; }

    .pr-open-btn {
      background: #171c24;
      border: 1px solid var(--border);
      color: var(--fl-cyan);
      border-radius: 4px;
      padding: 4px 7px;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    /* PIANO ROLL */
    .piano-roll-wrap {
      flex: 1;
      display: flex;
      overflow: auto;
      background: #12161d;
    }
    .piano-keys {
      width: 58px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #090b0f;
    }
    .p-key {
      height: 20px;
      border-bottom: 1px solid #2b323e;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 5px;
      font-size: 9px;
      font-weight: 800;
      cursor: pointer;
    }
    .p-key.white { background: #e2e8f0; color: #0f172a; }
    .p-key.black { background: #1e293b; color: #94a3b8; }
    .p-key:active { background: var(--fl-orange); color: #000; }

    .pr-grid {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 560px;
    }
    .pr-row {
      height: 20px;
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      border-bottom: 1px solid #1f2631;
    }
    .pr-row.black-row { background: rgba(9, 12, 18, 0.45); }
    .pr-cell {
      border-right: 1px solid #232a37;
      cursor: pointer;
    }
    .pr-cell:nth-child(4n) { border-right: 2px solid #364154; }
    .pr-cell.active {
      background: linear-gradient(180deg, #4ade80, #16a34a);
      border: 1px solid #bbf7d0;
      border-radius: 3px;
    }
    .pr-cell.playhead { background: rgba(255, 255, 255, 0.16); }

    /* SONG PLAYLIST ARRANGER */
    .playlist-grid {
      flex: 1;
      overflow: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pl-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: max-content;
    }
    .pl-label {
      width: 110px;
      background: #232934;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 6px 8px;
      font-weight: 800;
      font-size: 11px;
      color: var(--fl-orange);
    }
    .pl-bar-cell {
      width: 52px;
      height: 28px;
      background: #1a202a;
      border: 1px solid #2e3746;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      color: transparent;
    }
    .pl-bar-cell.placed {
      background: linear-gradient(135deg, #2563eb, #0284c7);
      border-color: #7dd3fc;
      color: #ffffff;
    }
    .pl-bar-cell.playhead {
      outline: 2px solid var(--fl-green);
    }

    /* RIGHT: SYNTHESIZER RACK & MASTER MIXER */
    .inspector-pane {
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .synth-card {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .synth-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 900;
      color: var(--fl-orange);
      font-size: 11px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .param-box {
      background: #141820;
      border: 1px solid #2b3342;
      border-radius: 6px;
      padding: 5px 7px;
    }
    .param-box label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 3px;
    }
    .param-box label b { color: var(--fl-cyan); }
    .param-box input[type="range"], .param-box select {
      width: 100%;
      accent-color: var(--fl-orange);
      background: #0d1016;
      color: #fff;
      border: 1px solid #333c4d;
      border-radius: 4px;
      font-size: 11px;
      padding: 2px;
    }

    /* Mixer Strips */
    .mixer-wrap {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mixer-strips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .mix-strip {
      width: 52px;
      flex-shrink: 0;
      background: #141820;
      border: 1px solid #2d3544;
      border-radius: 6px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .mix-strip.master { border-color: var(--fl-orange); }
    .mix-name {
      font-size: 9px;
      font-weight: 800;
      text-align: center;
      color: #cbd5e1;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .vu-meter {
      width: 10px;
      height: 68px;
      background: #090b0f;
      border: 1px solid #2b3342;
      border-radius: 3px;
      display: flex;
      flex-direction: column-reverse;
      overflow: hidden;
    }
    .vu-fill {
      width: 100%;
      height: 0%;
      background: linear-gradient(0deg, #22c55e 0%, #facc15 72%, #ef4444 95%);
      transition: height 0.06s linear;
    }
    .mix-fader {
      writing-mode: bt-lr;
      -webkit-appearance: slider-vertical;
      width: 18px;
      height: 64px;
      accent-color: var(--fl-orange);
      cursor: pointer;
    }

    /* Mini Live Keyboard Footer */
    .mini-kbd {
      height: 44px;
      background: #12151c;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: stretch;
      padding: 3px 8px;
      gap: 2px;
      flex-shrink: 0;
    }
    .kbd-note {
      flex: 1;
      border-radius: 0 0 5px 5px;
      border: 1px solid #1e293b;
      background: #e2e8f0;
      color: #0f172a;
      font-size: 9px;
      font-weight: 900;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 3px;
      cursor: pointer;
    }
    .kbd-note.sharp {
      background: #1e293b;
      color: #94a3b8;
      height: 68%;
    }
    .kbd-note:active, .kbd-note.pressed {
      background: var(--fl-orange);
      color: #000;
    }

    @media (max-width: 920px) {
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: 135px 1fr 190px;
      }
      .browser-pane { border-right: none; border-bottom: 1px solid var(--border); }
      .inspector-pane { border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="daw-shell">
    <!-- Top Transport Bar -->
    <header class="transport-bar">
      <div class="brand-cluster">
        <div class="fl-logo">🍊 FRUITY<span>WEB STUDIO</span></div>
        <div class="menu-actions">
          <button type="button" class="menu-btn" id="importAudioBtn" title="Importuj plik WAV/MP3/OGG jako nowy kanał">📥 Import Audio</button>
          <button type="button" class="menu-btn" id="importProjBtn" title="Wczytaj projekt lub bibliotekę JSON">📂 Wczytaj</button>
          <button type="button" class="menu-btn" id="saveProjBtn" title="Zapisz projekt i biblioteki do pliku JSON">💾 Zapisz Projekt</button>
          <button type="button" class="menu-btn export-wav" id="exportWavBtn" title="Renderuj i pobierz utwór jako plik WAV">💿 Eksportuj WAV</button>
        </div>
      </div>

      <div class="transport-controls">
        <div class="mode-toggle">
          <button type="button" class="mode-pill active pat" id="modePatBtn">PAT</button>
          <button type="button" class="mode-pill song" id="modeSongBtn">SONG</button>
        </div>
        <button type="button" class="t-btn" id="playBtn" title="Play / Pause [SPACE]">▶</button>
        <button type="button" class="t-btn" id="stopBtn" title="Stop">■</button>
        <div class="lcd-display">
          <div class="lcd-group">
            <span class="lcd-lbl">TEMPO (BPM)</span>
            <input type="number" class="bpm-input" id="bpmInput" min="60" max="220" value="128" />
          </div>
          <div class="lcd-group">
            <span class="lcd-lbl">BAR : STEP</span>
            <span class="lcd-val time" id="posLcd">01 : 01</span>
          </div>
        </div>
      </div>

      <div class="view-tabs">
        <button type="button" class="v-tab active" data-view="rack">Channel Rack</button>
        <button type="button" class="v-tab" data-view="pianoroll">Piano Roll</button>
        <button type="button" class="v-tab" data-view="playlist">Playlist</button>
      </div>
    </header>

    <!-- Hidden File Inputs -->
    <input type="file" id="audioFileInput" accept="audio/*" style="display:none;" />
    <input type="file" id="projFileInput" accept=".json,application/json" style="display:none;" />

    <!-- Main 3-Column DAW Workspace -->
    <div class="workspace">
      <!-- Left: Sound & Instrument Library Browser -->
      <aside class="browser-pane">
        <div class="pane-header">
          <span>BIBLIOTEKA DŹWIĘKÓW</span>
          <button type="button" class="menu-btn" id="exportLibBtn" style="padding:2px 6px; font-size:10px;" title="Eksportuj własną bibliotekę">Eksport</button>
        </div>
        <div class="browser-tools">
          <input type="text" class="browser-search" id="libSearch" placeholder="Szukaj sampli i synthów..." />
        </div>
        <div class="browser-tree" id="browserTree"></div>
      </aside>

      <!-- Center: Channel Rack / Piano Roll / Song Playlist -->
      <main class="center-pane">
        <!-- Pattern Bar -->
        <div class="pattern-bar">
          <div class="pat-pills" id="patPills"></div>
          <div style="display:flex; gap:5px; align-items:center;">
            <button type="button" class="menu-btn" id="addPatternBtn">+ Pattern</button>
            <button type="button" class="menu-btn" id="clearPatternBtn">Wyczyść</button>
          </div>
        </div>

        <!-- View 1: Step Sequencer / Channel Rack -->
        <section class="sub-window active" id="view-rack">

  <script>
    (() => {
      // =========================================================================
      // 1. BUILT-IN SOUND & INSTRUMENT LIBRARIES (Synthesized & Procedural Drums/Synths)
      // =========================================================================
      const DEFAULT_LIBRARIES = [
        {
          folder: '🥁 Drums · Trap & EDM Pack',
          items: [
            { id: 'kick_808',   name: '808 Sub Kick',     color: '#ef4444', engine: 'drum', preset: 'kick808',   wave: 'sine',     cutoff: 220,  attack: 0.005, decay: 0.42, sustain: 0.0, release: 0.12 },
            { id: 'kick_punch', name: 'Punchy Club Kick', color: '#f97316', engine: 'drum', preset: 'kickPunch', wave: 'sine',     cutoff: 320,  attack: 0.003, decay: 0.24, sustain: 0.0, release: 0.08 },
            { id: 'snare_trap', name: 'Crisp Trap Snare', color: '#38bdf8', engine: 'drum', preset: 'snare',     wave: 'triangle', cutoff: 3200, attack: 0.002, decay: 0.18, sustain: 0.0, release: 0.08 },
            { id: 'clap_909',   name: '909 Studio Clap',  color: '#f472b6', engine: 'drum', preset: 'clap',      wave: 'sawtooth', cutoff: 2600, attack: 0.005, decay: 0.22, sustain: 0.0, release: 0.10 },
            { id: 'hat_closed', name: 'Closed Hi-Hat',    color: '#facc15', engine: 'drum', preset: 'hatClosed', wave: 'square',   cutoff: 8500, attack: 0.001, decay: 0.06, sustain: 0.0, release: 0.03 },
            { id: 'hat_open',   name: 'Open Hi-Hat',      color: '#eab308', engine: 'drum', preset: 'hatOpen',   wave: 'square',   cutoff: 7800, attack: 0.005, decay: 0.28, sustain: 0.0, release: 0.12 }
          ]
        },
        {
          folder: '🎹 Synths · Leads & Basses',
          items: [
            { id: 'bass_reese', name: 'Reese Saw Bass',   color: '#a855f7', engine: 'synth', preset: 'synth',    wave: 'sawtooth', cutoff: 620,  attack: 0.015, decay: 0.22, sustain: 0.55, release: 0.16 },
            { id: 'lead_supersaw',name:'Supersaw Lead',   color: '#22c55e', engine: 'synth', preset: 'synth',    wave: 'sawtooth', cutoff: 4200, attack: 0.02,  decay: 0.18, sustain: 0.65, release: 0.22 },
            { id: 'pluck_neon', name: 'Neon Pluck',       color: '#06b6d4', engine: 'synth', preset: 'synth',    wave: 'triangle', cutoff: 2600, attack: 0.005, decay: 0.20, sustain: 0.12, release: 0.14 },
            { id: 'keys_8bit',  name: 'Retro Square Keys',color: '#ec4899', engine: 'synth', preset: 'synth',    wave: 'square',   cutoff: 3100, attack: 0.01,  decay: 0.16, sustain: 0.45, release: 0.15 },
            { id: 'pad_warm',   name: 'Ambient Pad',      color: '#6366f1', engine: 'synth', preset: 'synth',    wave: 'sine',     cutoff: 1600, attack: 0.12,  decay: 0.35, sustain: 0.75, release: 0.40 }
          ]
        },
        {
          folder: '📁 Imported Audio Samples',
          items: []
        }
      ];

      // Note frequencies (C4 to B5)
      const NOTES = [
        { name: 'B5', midi: 83, sharp: false },
        { name: 'A#5',midi: 82, sharp: true  },
        { name: 'A5', midi: 81, sharp: false },
        { name: 'G#5',midi: 80, sharp: true  },
        { name: 'G5', midi: 79, sharp: false },
        { name: 'F#5',midi: 78, sharp: true  },
        { name: 'F5', midi: 77, sharp: false },
        { name: 'E5', midi: 76, sharp: false },
        { name: 'D#5',midi: 75, sharp: true  },
        { name: 'D5', midi: 74, sharp: false },
        { name: 'C#5',midi: 73, sharp: true  },
        { name: 'C5', midi: 72, sharp: false },
        { name: 'B4', midi: 71, sharp: false },
        { name: 'A#4',midi: 70, sharp: true  },
        { name: 'A4', midi: 69, sharp: false },
        { name: 'G#4',midi: 68, sharp: true  },
        { name: 'G4', midi: 67, sharp: false },
        { name: 'F#4',midi: 66, sharp: true  },
        { name: 'F4', midi: 65, sharp: false },
        { name: 'E4', midi: 64, sharp: false },
        { name: 'D#4',midi: 63, sharp: true  },
        { name: 'D4', midi: 62, sharp: false },
        { name: 'C#4',midi: 61, sharp: true  },
        { name: 'C4', midi: 60, sharp: false }
      ];

      function midiToFreq(midi) {
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

      // =========================================================================
      // 2. PROJECT STATE
      // =========================================================================
      let libraries = JSON.parse(JSON.stringify(DEFAULT_LIBRARIES));
      const importedBuffers = new Map(); // sampleId -> AudioBuffer (plus base64 dataUrl for saving)
      const importedDataUrls = new Map();

      let bpm = 128;
      let playMode = 'pat'; // 'pat' | 'song'
      let isPlaying = false;
      let currentStep = 0; // 0..15 within bar
      let currentBar = 0;  // 0..15 in playlist
      let activePatternIdx = 0;
      let selectedChannelIdx = 0;
      let activeView = 'rack'; // 'rack' | 'pianoroll' | 'playlist'
      let masterVolume = 0.85;
      let masterDelayWet = 0.20;

      // Channels list
      let channels = [
        { ...DEFAULT_LIBRARIES[0].items[0], uid: 'ch_1', volume: 0.9, pan: 0, muted: false },
        { ...DEFAULT_LIBRARIES[0].items[2], uid: 'ch_2', volume: 0.82, pan: 0, muted: false },
        { ...DEFAULT_LIBRARIES[0].items[4], uid: 'ch_3', volume: 0.65, pan: -0.15, muted: false },
        { ...DEFAULT_LIBRARIES[1].items[0], uid: 'ch_4', volume: 0.78, pan: 0, muted: false },
        { ...DEFAULT_LIBRARIES[1].items[2], uid: 'ch_5', volume: 0.75, pan: 0.15, muted: false }
      ];

      // Patterns: each pattern maps channel.uid -> { steps: boolean[16], notes: Array<{step, midi}> }
      function createBlankPattern(name) {
        const data = {};
        channels.forEach(ch => {
          data[ch.uid] = { steps: Array(16).fill(false), notes: [] };
        });
        return { name, data };
      }

      let patterns = [
        createBlankPattern('Pattern 1'),
        createBlankPattern('Pattern 2'),
        createBlankPattern('Pattern 3'),
        createBlankPattern('Pattern 4')
      ];

      // Seed Pattern 1 & Pattern 2 with an immediate playable beat so user hears FL-style groove right away
      patterns[0].data['ch_1'].steps = [true,false,false,false, true,false,false,false, true,false,false,false, true,false,true,false];
      patterns[0].data['ch_2'].steps = [false,false,false,false, true,false,false,false, false,false,false,false, true,false,false,false];
      patterns[0].data['ch_3'].steps = [true,false,true,false, true,false,true,false, true,false,true,false, true,false,true,true];
      patterns[0].data['ch_4'].notes = [
        { step: 0, midi: 60 }, { step: 3, midi: 60 }, { step: 6, midi: 63 },
        { step: 8, midi: 65 }, { step: 11, midi: 63 }, { step: 14, midi: 67 }
      ];
      patterns[0].data['ch_5'].notes = [
        { step: 0, midi: 72 }, { step: 4, midi: 75 }, { step: 8, midi: 79 }, { step: 12, midi: 77 }
      ];

      patterns[1].data['ch_1'].steps = [true,false,true,false, true,false,false,false, true,false,true,false, true,true,false,true];
      patterns[1].data['ch_2'].steps = [false,false,false,false, true,false,false,true, false,false,false,false, true,false,true,false];
      patterns[1].data['ch_3'].steps = [true,true,true,true, true,true,true,true, true,true,true,true, true,true,true,true];

      // Song Playlist: 4 tracks x 16 bars -> pattern index or null
      let playlist = [
        [0, 0, 1, 1, 0, 0, 1, 1, null, null, null, null, null, null, null, null],
        [null, 0, 0, 1, 1, 0, 0, 1, null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null]
      ];

      // =========================================================================
      // 3. WEBAUDIO REALTIME & OFFLINE RENDER ENGINE
      // =========================================================================
      let audioCtx = null;
      let masterGain = null;
      let delayNode = null;
      let delayGain = null;
      let analyser = null;

      function ensureAudio() {
        if (!audioCtx) {
          const C = window.AudioContext || window.webkitAudioContext;
          audioCtx = new C();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = masterVolume;

          delayNode = audioCtx.createDelay(1.0);
          delayNode.delayTime.value = 0.28;
          const fb = audioCtx.createGain();
          fb.gain.value = 0.32;
          delayGain = audioCtx.createGain();
          delayGain.gain.value = masterDelayWet;

          delayNode.connect(fb);
          fb.connect(delayNode);
          delayNode.connect(delayGain);
          delayGain.connect(masterGain);

          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          masterGain.connect(analyser);
          analyser.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function triggerChannelVoice(ctx, destNode, delayInput, ch, midi = 60, time = ctx.currentTime, dur = 0.22) {
        if (ch.muted) return;
        const chGain = ctx.createGain();
        chGain.gain.setValueAtTime(ch.volume, time);

        let panner = null;
        if (ctx.createStereoPanner) {
          panner = ctx.createStereoPanner();
          panner.pan.setValueAtTime(ch.pan || 0, time);
          chGain.connect(panner);
          panner.connect(destNode);
          if (delayInput && ch.engine === 'synth') panner.connect(delayInput);
        } else {
          chGain.connect(destNode);
          if (delayInput && ch.engine === 'synth') chGain.connect(delayInput);
        }

        // Imported Audio Sample playback
        if (ch.engine === 'sample' && importedBuffers.has(ch.id)) {
          const src = ctx.createBufferSource();
          src.buffer = importedBuffers.get(ch.id);
          src.playbackRate.setValueAtTime(Math.pow(2, (midi - 60) / 12), time);
          src.connect(chGain);
          src.start(time);
          return;
        }

        // Synthesized Drum Voices
        if (ch.engine === 'drum') {
          if (ch.preset === 'kick808' || ch.preset === 'kickPunch') {
            const osc = ctx.createOscillator();
            const env = ctx.createGain();
            osc.type = 'sine';
            const startF = ch.preset === 'kick808' ? 145 : 185;
            const endF = ch.preset === 'kick808' ? 38 : 48;
            const dec = ch.decay || 0.35;
            osc.frequency.setValueAtTime(startF, time);
            osc.frequency.exponentialRampToValueAtTime(endF, time + dec * 0.7);
            env.gain.setValueAtTime(1.0, time);
            env.gain.exponentialRampToValueAtTime(0.001, time + dec);
            osc.connect(env);
            env.connect(chGain);
            osc.start(time);
            osc.stop(time + dec + 0.02);
          } else if (ch.preset === 'snare' || ch.preset === 'clap') {
            // White noise burst + body tone
            const len = Math.floor(ctx.sampleRate * (ch.decay || 0.2));
            const buf = ctx.createBuffer(1, len, ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
            const noise = ctx.createBufferSource();
            noise.buffer = buf;

            const filt = ctx.createBiquadFilter();
            filt.type = ch.preset === 'clap' ? 'bandpass' : 'highpass';
            filt.frequency.setValueAtTime(ch.preset === 'clap' ? 1400 : 950, time);

            const env = ctx.createGain();
            env.gain.setValueAtTime(0.9, time);
            env.gain.exponentialRampToValueAtTime(0.001, time + (ch.decay || 0.2));
            noise.connect(filt);
            filt.connect(env);
            env.connect(chGain);
            noise.start(time);

            if (ch.preset === 'snare') {
              const body = ctx.createOscillator();
              const bEnv = ctx.createGain();
              body.type = 'triangle';
              body.frequency.setValueAtTime(195, time);
              body.frequency.exponentialRampToValueAtTime(85, time + 0.11);
              bEnv.gain.setValueAtTime(0.65, time);
              bEnv.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
              body.connect(bEnv);
              bEnv.connect(chGain);
              body.start(time);
              body.stop(time + 0.13);
            }
          } else {
            // Hi-Hat (closed or open)
            const dec = ch.decay || 0.07;
            const len = Math.floor(ctx.sampleRate * dec);
            const buf = ctx.createBuffer(1, len, ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
            const noise = ctx.createBufferSource();
            noise.buffer = buf;

            const hp = ctx.createBiquadFilter();
            hp.type = 'highpass';
            hp.frequency.setValueAtTime(ch.cutoff || 7500, time);

            const env = ctx.createGain();
            env.gain.setValueAtTime(0.55, time);
            env.gain.exponentialRampToValueAtTime(0.001, time + dec);
            noise.connect(hp);
            hp.connect(env);
            env.connect(chGain);
            noise.start(time);
          }
          return;
        }

        // Subtractive Poly-Synth Engine (Oscillator + Lowpass Filter + ADSR)
        const osc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();
        const env = ctx.createGain();

        osc.type = ch.wave || 'sawtooth';
        osc.frequency.setValueAtTime(midiToFreq(midi), time);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(ch.cutoff || 2400, time);
        filter.Q.setValueAtTime(2.5, time);

        const a = Math.max(0.002, ch.attack || 0.01);
        const d = Math.max(0.02, ch.decay || 0.18);
        const s = Math.max(0.01, ch.sustain ?? 0.45);
        const r = Math.max(0.02, ch.release || 0.15);

        env.gain.setValueAtTime(0.001, time);
        env.gain.linearRampToValueAtTime(0.65, time + a);
        env.gain.exponentialRampToValueAtTime(Math.max(0.01, 0.65 * s), time + a + d);
        env.gain.setValueAtTime(Math.max(0.01, 0.65 * s), time + dur);
        env.gain.exponentialRampToValueAtTime(0.001, time + dur + r);

        osc.connect(filter);
        filter.connect(env);
        env.connect(chGain);

        osc.start(time);
        osc.stop(time + dur + r + 0.02);
      }

      // =========================================================================
      // 4. SEQUENCER CLOCK (PAT & SONG MODES)
      // =========================================================================
      let stepTimer = null;

      function getStepDurationSec() {
        return (60 / bpm) / 4; // 16th note
      }

      function playStepEvents(patIdx, stepIdx, time = null) {
        const ctx = ensureAudio();
        const when = time !== null ? time : ctx.currentTime;
        const pat = patterns[patIdx];
        if (!pat) return;

        const stepDur = getStepDurationSec();

        channels.forEach(ch => {
          const chData = pat.data[ch.uid];
          if (!chData) return;

          if (chData.steps[stepIdx]) {
            triggerChannelVoice(ctx, masterGain, delayNode, ch, 60, when, stepDur * 0.9);
          }
          if (chData.notes && chData.notes.length > 0) {
            chData.notes.forEach(n => {
              if (n.step === stepIdx) {
                triggerChannelVoice(ctx, masterGain, delayNode, ch, n.midi, when, stepDur * 1.4);
              }
            });
          }
        });
      }

      function tickSequencer() {
        if (!isPlaying) return;

        if (playMode === 'pat') {
          playStepEvents(activePatternIdx, currentStep);
        } else {
          // Song mode: play all patterns scheduled on currentBar across playlist rows
          const activePats = new Set();
          playlist.forEach(row => {
            const pIdx = row[currentBar];
            if (pIdx !== null && pIdx !== undefined) activePats.add(pIdx);
          });
          activePats.forEach(pIdx => playStepEvents(pIdx, currentStep));
        }

        updatePlayheadUI();

        currentStep++;
        if (currentStep >= 16) {
          currentStep = 0;
          if (playMode === 'song') {
            currentBar = (currentBar + 1) % 16;
          }
        }
      }

      function startPlayback() {
        ensureAudio();
        if (isPlaying) return;
        isPlaying = true;
        document.getElementById('playBtn').classList.add('playing');
        document.getElementById('playBtn').textContent = '❚❚';
        tickSequencer();
        stepTimer = setInterval(tickSequencer, getStepDurationSec() * 1000);
      }

      function stopPlayback() {
        isPlaying = false;
        clearInterval(stepTimer);
        currentStep = 0;
        currentBar = 0;
        document.getElementById('playBtn').classList.remove('playing');
        document.getElementById('playBtn').textContent = '▶';
        updatePlayheadUI();
      }

      function restartClockIfPlaying() {
        if (!isPlaying) return;
        clearInterval(stepTimer);
        stepTimer = setInterval(tickSequencer, getStepDurationSec() * 1000);
      }

      function updatePlayheadUI() {
        const barNum = playMode === 'song' ? currentBar + 1 : activePatternIdx + 1;
        document.getElementById('posLcd').textContent =
          `${String(barNum).padStart(2, '0')} : ${String(currentStep + 1).padStart(2, '0')}`;

        document.querySelectorAll('.step-cell.playhead').forEach(el => el.classList.remove('playhead'));
        document.querySelectorAll('.pr-cell.playhead').forEach(el => el.classList.remove('playhead'));
        document.querySelectorAll('.pl-bar-cell.playhead').forEach(el => el.classList.remove('playhead'));

        if (isPlaying) {
          document.querySelectorAll(`.step-cell[data-step="${currentStep}"]`).forEach(el => el.classList.add('playhead'));
          document.querySelectorAll(`.pr-cell[data-step="${currentStep}"]`).forEach(el => el.classList.add('playhead'));
          if (playMode === 'song') {
            document.querySelectorAll(`.pl-bar-cell[data-bar="${currentBar}"]`).forEach(el => el.classList.add('playhead'));
          }
        }
      }

      // =========================================================================
      // 5. OFFLINE WAV EXPORT (Renders real stereo .wav file of Pattern or Song)
      // =========================================================================
      async function exportSongToWav() {
        const statusEl = document.getElementById('statusBanner');
        statusEl.textContent = 'RENDEROWANIE WAV...';

        const stepDur = getStepDurationSec();
        const totalBars = playMode === 'song' ? 16 : 2;
        const totalSteps = totalBars * 16;
        const durationSec = totalSteps * stepDur + 1.0;
        const sampleRate = 44100;

        const offline = new OfflineAudioContext(2, Math.ceil(sampleRate * durationSec), sampleRate);
        const outGain = offline.createGain();
        outGain.gain.value = masterVolume;
        outGain.connect(offline.destination);

        for (let b = 0; b < totalBars; b++) {
          for (let s = 0; s < 16; s++) {
            const time = (b * 16 + s) * stepDur;
            const patsToPlay = playMode === 'pat'
              ? [activePatternIdx]
              : [...new Set(playlist.map(r => r[b]).filter(v => v !== null && v !== undefined))];

            patsToPlay.forEach(pIdx => {
              const pat = patterns[pIdx];
              if (!pat) return;
              channels.forEach(ch => {
                const chData = pat.data[ch.uid];
                if (!chData) return;
                if (chData.steps[s]) {
                  triggerChannelVoice(offline, outGain, null, ch, 60, time, stepDur * 0.9);
                }
                if (chData.notes) {
                  chData.notes.forEach(n => {
                    if (n.step === s) {
                      triggerChannelVoice(offline, outGain, null, ch, n.midi, time, stepDur * 1.4);
                    }
                  });
                }
              });
            });
          }
        }

        const rendered = await offline.startRendering();
        const wavBlob = audioBufferToWavBlob(rendered);
        const url = URL.createObjectURL(wavBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `FruityWeb_${playMode === 'song' ? 'FullSong' : 'Pattern' + (activePatternIdx + 1)}_${bpm}BPM.wav`;
        a.click();
        URL.revokeObjectURL(url);
        statusEl.textContent = 'WAV WYEKSPORTOWANY!';
      }

      function audioBufferToWavBlob(buffer) {
        const numCh = buffer.numberOfChannels;
        const length = buffer.length * numCh * 2 + 44;
        const out = new ArrayBuffer(length);
        const view = new DataView(out);
        const channelsData = [];
        for (let i = 0; i < numCh; i++) channelsData.push(buffer.getChannelData(i));

        const writeStr = (off, str) => {
          for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
        };

        writeStr(0, 'RIFF');
        view.setUint32(4, length - 8, true);
        writeStr(8, 'WAVE');
        writeStr(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numCh, true);
        view.setUint32(24, buffer.sampleRate, true);
        view.setUint32(28, buffer.sampleRate * numCh * 2, true);
        view.setUint16(32, numCh * 2, true);
        view.setUint16(34, 16, true);
        writeStr(36, 'data');
        view.setUint32(40, length - 44, true);

        let pos = 44;
        for (let i = 0; i < buffer.length; i++) {
          for (let ch = 0; ch < numCh; ch++) {
            const sample = Math.max(-1, Math.min(1, channelsData[ch][i]));
            view.setInt16(pos, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
            pos += 2;
          }
        }
        return new Blob([out], { type: 'audio/wav' });
      }

      // =========================================================================
      // 6. UI RENDERERS (BROWSER, CHANNEL RACK, PIANO ROLL, PLAYLIST, SYNTH)
      // =========================================================================
      function renderBrowser() {
        const query = (document.getElementById('libSearch').value || '').toLowerCase().trim();
        const tree = document.getElementById('browserTree');
        tree.innerHTML = libraries.map((lib, fIdx) => {
          const filtered = lib.items.filter(it => it.name.toLowerCase().includes(query));
          if (query && filtered.length === 0) return '';
          return `
            <div class="lib-folder">
              <div class="lib-folder-title">
                <span>${lib.folder}</span>
                <span>(${filtered.length})</span>
              </div>
              <div class="lib-items">
                ${filtered.length === 0
                  ? `<div style="padding:4px 6px; color:#64748b; font-size:10px;">Brak elementów (użyj Import Audio)</div>`
                  : filtered.map((item, iIdx) => `
                    <div class="lib-item" data-f="${fIdx}" data-id="${item.id}">
                      <span style="display:flex; align-items:center; gap:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                        <span style="width:7px; height:7px; border-radius:50%; background:${item.color}; flex-shrink:0;"></span>
                        <span>${item.name}</span>
                      </span>
                      <button type="button" class="add-ch-btn" data-add="${item.id}" title="Dodaj jako kanał">+CH</button>
                    </div>
                  `).join('')}
              </div>
            </div>
          `;
        }).join('');

        // Click item to preview sound
        tree.querySelectorAll('.lib-item').forEach(el => {
          el.addEventListener('click', (e) => {
            if (e.target.closest('[data-add]')) return;
            const item = findLibraryItemById(el.dataset.id);
            if (!item) return;
            const ctx = ensureAudio();
            triggerChannelVoice(ctx, masterGain, null, { ...item, volume: 0.85, pan: 0, muted: false }, 60);
          });
        });

        // Click +CH to add to Channel Rack
        tree.querySelectorAll('[data-add]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const item = findLibraryItemById(btn.dataset.add);
            if (!item) return;
            const newUid = 'ch_' + Date.now().toString(36) + Math.floor(Math.random() * 99);
            channels.push({ ...item, uid: newUid, volume: 0.85, pan: 0, muted: false });
            patterns.forEach(p => {
              p.data[newUid] = { steps: Array(16).fill(false), notes: [] };
            });
            selectedChannelIdx = channels.length - 1;
            renderAll();
          });
        });
      }

      function findLibraryItemById(id) {
        for (const lib of libraries) {
          const found = lib.items.find(it => it.id === id);
          if (found) return found;
        }
        return null;
      }

      function renderPatternsBar() {
        const wrap = document.getElementById('patPills');
        wrap.innerHTML = patterns.map((p, idx) => `
          <button type="button" class="pat-btn ${idx === activePatternIdx ? 'active' : ''}" data-pat="${idx}">
            ${p.name}
          </button>
        `).join('');

        wrap.querySelectorAll('[data-pat]').forEach(btn => {
          btn.addEventListener('click', () => {
            activePatternIdx = Number(btn.dataset.pat);
            renderAll();
          });
        });
      }

      function renderChannelRack() {
        const list = document.getElementById('rackList');
        const pat = patterns[activePatternIdx];

        list.innerHTML = channels.map((ch, cIdx) => {
          const chData = pat.data[ch.uid] || { steps: Array(16).fill(false), notes: [] };
          const hasNotes = chData.notes && chData.notes.length > 0;

          return `
            <div class="channel-row ${cIdx === selectedChannelIdx ? 'selected-ch' : ''}">
              <button type="button" class="mute-led ${ch.muted ? 'muted' : ''}" data-mute="${cIdx}" title="Mute / Unmute"></button>
              <input type="range" class="ch-knob" min="0" max="1" step="0.05" value="${ch.volume}" data-vol="${cIdx}" title="Głośność kanału" />
              <button type="button" class="ch-name-btn" data-sel="${cIdx}">
                <span style="overflow:hidden; text-overflow:ellipsis;">${ch.name}</span>
                <span class="dot" style="background:${ch.color};"></span>
              </button>
              <div class="steps-grid">
                ${Array.from({ length: 16 }, (_, sIdx) => {
                  const beatGroup = Math.floor(sIdx / 4) % 2 === 0 ? 'beat-a' : 'beat-b';
                  const isOn = chData.steps[sIdx];
                  return `<button type="button" class="step-cell ${beatGroup} ${isOn ? 'on' : ''}" data-ch="${ch.uid}" data-step="${sIdx}"></button>`;
                }).join('')}
              </div>
              <button type="button" class="pr-open-btn" data-openpr="${cIdx}" title="Otwórz Piano Roll">
                ${hasNotes ? `🎹 (${chData.notes.length})` : '🎹'}
              </button>
            </div>
          `;
        }).join('');

        list.querySelectorAll('[data-mute]').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.dataset.mute);
            channels[idx].muted = !channels[idx].muted;
            renderChannelRack();
            renderMixer();
          });
        });

        list.querySelectorAll('[data-vol]').forEach(inp => {
          inp.addEventListener('input', () => {
            const idx = Number(inp.dataset.vol);
            channels[idx].volume = Number(inp.value);
            renderMixer();
          });
        });

        list.querySelectorAll('[data-sel]').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedChannelIdx = Number(btn.dataset.sel);
            const ch = channels[selectedChannelIdx];
            const ctx = ensureAudio();
            triggerChannelVoice(ctx, masterGain, null, ch, 60);
            renderChannelRack();
            renderSynthInspector();
          });
        });

        list.querySelectorAll('.step-cell').forEach(cell => {
          cell.addEventListener('click', () => {
            const uid = cell.dataset.ch;
            const s = Number(cell.dataset.step);
            const chData = pat.data[uid];
            chData.steps[s] = !chData.steps[s];
            cell.classList.toggle('on', chData.steps[s]);
            if (chData.steps[s]) {
              const ch = channels.find(c => c.uid === uid);
              if (ch) {
                const ctx = ensureAudio();
                triggerChannelVoice(ctx, masterGain, null, ch, 60);
              }
            }
          });
        });

        list.querySelectorAll('[data-openpr]').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedChannelIdx = Number(btn.dataset.openpr);
            switchView('pianoroll');
          });
        });
      }

      function renderPianoRoll() {
        const ch = channels[selectedChannelIdx] || channels[0];
        if (!ch) return;
        document.getElementById('prChannelTitle').textContent = `Piano Roll · ${ch.name} (${patterns[activePatternIdx].name})`;

        const keysEl = document.getElementById('pianoKeys');
        const gridEl = document.getElementById('prGrid');
        const chData = patterns[activePatternIdx].data[ch.uid];

        keysEl.innerHTML = NOTES.map(n => `
          <div class="p-key ${n.sharp ? 'black' : 'white'}" data-midi="${n.midi}">${n.name}</div>
        `).join('');

        gridEl.innerHTML = NOTES.map(n => `
          <div class="pr-row ${n.sharp ? 'black-row' : ''}">
            ${Array.from({ length: 16 }, (_, step) => {
              const active = chData.notes.some(item => item.step === step && item.midi === n.midi);
              return `<div class="pr-cell ${active ? 'active' : ''}" data-step="${step}" data-midi="${n.midi}"></div>`;
            }).join('')}
          </div>
        `).join('');

        keysEl.querySelectorAll('.p-key').forEach(k => {
          k.addEventListener('pointerdown', () => {
            const ctx = ensureAudio();
            triggerChannelVoice(ctx, masterGain, null, ch, Number(k.dataset.midi), ctx.currentTime, 0.25);
          });
        });

        gridEl.querySelectorAll('.pr-cell').forEach(cell => {
          cell.addEventListener('click', () => {
            const step = Number(cell.dataset.step);
            const midi = Number(cell.dataset.midi);
            const existingIdx = chData.notes.findIndex(item => item.step === step && item.midi === midi);
            if (existingIdx !== -1) {
              chData.notes.splice(existingIdx, 1);
              cell.classList.remove('active');
            } else {
              chData.notes.push({ step, midi });
              cell.classList.add('active');
              const ctx = ensureAudio();
              triggerChannelVoice(ctx, masterGain, null, ch, midi, ctx.currentTime, 0.22);
            }
            renderChannelRack();
          });
        });
      }

      function renderPlaylist() {
        const gridEl = document.getElementById('playlistGrid');
        gridEl.innerHTML = playlist.map((row, tIdx) => `
          <div class="pl-row">
            <div class="pl-label">Track ${tIdx + 1}</div>
            ${row.map((patVal, bIdx) => `
              <button type="button" class="pl-bar-cell ${patVal !== null ? 'placed' : ''}" data-track="${tIdx}" data-bar="${bIdx}">
                ${patVal !== null ? `P${patVal + 1}` : ''}
              </button>
            `).join('')}
          </div>
        `).join('');

        gridEl.querySelectorAll('.pl-bar-cell').forEach(btn => {
          btn.addEventListener('click', () => {
            const t = Number(btn.dataset.track);
            const b = Number(btn.dataset.bar);
            if (playlist[t][b] === activePatternIdx) {
              playlist[t][b] = null;
            } else {
              playlist[t][b] = activePatternIdx;
            }
            renderPlaylist();
          });
        });
      }

      function renderSynthInspector() {
        const ch = channels[selectedChannelIdx];
        const wrap = document.getElementById('synthInspector');
        if (!ch) { wrap.innerHTML = ''; return; }

        wrap.innerHTML = `
          <div class="synth-title">
            <span>🎛️ KANAŁ: ${ch.name.toUpperCase()}</span>
            <button type="button" class="menu-btn" id="delChannelBtn" style="padding:2px 6px; color:#fb7185;">Usuń</button>
          </div>
          <div class="control-grid">
            <div class="param-box">
              <label><span>Waveform</span></label>
              <select id="waveSelect" ${ch.engine === 'sample' ? 'disabled' : ''}>
                <option value="sine" ${ch.wave === 'sine' ? 'selected' : ''}>Sine</option>
                <option value="triangle" ${ch.wave === 'triangle' ? 'selected' : ''}>Triangle</option>
                <option value="sawtooth" ${ch.wave === 'sawtooth' ? 'selected' : ''}>Sawtooth</option>
                <option value="square" ${ch.wave === 'square' ? 'selected' : ''}>Square</option>
              </select>
            </div>
            <div class="param-box">
              <label><span>Filter Cutoff</span><b id="cutLbl">${ch.cutoff}Hz</b></label>
              <input type="range" id="cutSlider" min="150" max="9000" step="50" value="${ch.cutoff}" />
            </div>
            <div class="param-box">
              <label><span>Attack</span><b id="attLbl">${Math.round((ch.attack || 0.01) * 1000)}ms</b></label>
              <input type="range" id="attSlider" min="0.002" max="0.4" step="0.005" value="${ch.attack || 0.01}" />
            </div>
            <div class="param-box">
              <label><span>Decay</span><b id="decLbl">${Math.round((ch.decay || 0.2) * 1000)}ms</b></label>
              <input type="range" id="decSlider" min="0.04" max="0.8" step="0.01" value="${ch.decay || 0.2}" />
            </div>
            <div class="param-box">
              <label><span>Panning</span><b id="panLbl">${Math.round((ch.pan || 0) * 100)}%</b></label>
              <input type="range" id="panSlider" min="-1" max="1" step="0.05" value="${ch.pan || 0}" />
            </div>
            <div class="param-box" style="display:flex; align-items:center; justify-content:center;">
              <button type="button" class="menu-btn" id="previewVoiceBtn" style="width:100%; justify-content:center; color:var(--fl-orange);">
                🔊 Testuj Dźwięk
              </button>
            </div>
          </div>
        `;

        document.getElementById('waveSelect')?.addEventListener('change', e => { ch.wave = e.target.value; });
        document.getElementById('cutSlider')?.addEventListener('input', e => {
          ch.cutoff = Number(e.target.value);
          document.getElementById('cutLbl').textContent = `${ch.cutoff}Hz`;
        });
        document.getElementById('attSlider')?.addEventListener('input', e => {
          ch.attack = Number(e.target.value);
          document.getElementById('attLbl').textContent = `${Math.round(ch.attack * 1000)}ms`;
        });
        document.getElementById('decSlider')?.addEventListener('input', e => {
          ch.decay = Number(e.target.value);
          document.getElementById('decLbl').textContent = `${Math.round(ch.decay * 1000)}ms`;
        });
        document.getElementById('panSlider')?.addEventListener('input', e => {
          ch.pan = Number(e.target.value);
          document.getElementById('panLbl').textContent = `${Math.round(ch.pan * 100)}%`;
        });
        document.getElementById('previewVoiceBtn')?.addEventListener('click', () => {
          const ctx = ensureAudio();
          triggerChannelVoice(ctx, masterGain, delayNode, ch, 60);
        });
        document.getElementById('delChannelBtn')?.addEventListener('click', () => {
          if (channels.length <= 1) return;
          const removedUid = ch.uid;
          channels.splice(selectedChannelIdx, 1);
          patterns.forEach(p => { delete p.data[removedUid]; });
          selectedChannelIdx = Math.max(0, selectedChannelIdx - 1);
          renderAll();
        });
      }

      function renderMixer() {
        const strips = document.getElementById('mixerStrips');
        strips.innerHTML = [
          `<div class="mix-strip master">
             <div class="mix-name" style="color:var(--fl-orange);">MASTER</div>
             <div class="vu-meter"><div class="vu-fill" id="masterVu"></div></div>
             <input type="range" class="mix-fader" min="0" max="1" step="0.05" value="${masterVolume}" id="masterStripFader" />
           </div>`,
          ...channels.map((ch, idx) => `
            <div class="mix-strip">
              <div class="mix-name" style="color:${ch.color};">${ch.name}</div>
              <div class="vu-meter"><div class="vu-fill" style="height:${ch.muted ? 0 : Math.round(ch.volume * 75)}%;"></div></div>
              <input type="range" class="mix-fader" min="0" max="1" step="0.05" value="${ch.volume}" data-mixvol="${idx}" />
            </div>
          `)
        ].join('');

        document.getElementById('masterStripFader')?.addEventListener('input', e => {
          masterVolume = Number(e.target.value);
          if (masterGain) masterGain.gain.value = masterVolume;
          document.getElementById('masterVolSlider').value = masterVolume;
          document.getElementById('masterVolLbl').textContent = `${Math.round(masterVolume * 100)}%`;
        });

        strips.querySelectorAll('[data-mixvol]').forEach(fader => {
          fader.addEventListener('input', () => {
            const idx = Number(fader.dataset.mixvol);
            channels[idx].volume = Number(fader.value);
            renderChannelRack();
          });
        });
      }

      function renderMiniKeyboard() {
        const kbd = document.getElementById('miniKbd');
        const notesAsc = [...NOTES].reverse();
        kbd.innerHTML = notesAsc.map(n => `
          <button type="button" class="kbd-note ${n.sharp ? 'sharp' : ''}" data-midi="${n.midi}">
            ${n.name}
          </button>
        `).join('');

        kbd.querySelectorAll('.kbd-note').forEach(btn => {
          btn.addEventListener('pointerdown', e => {
            e.preventDefault();
            const ch = channels[selectedChannelIdx] || channels[0];
            if (!ch) return;
            const ctx = ensureAudio();
            triggerChannelVoice(ctx, masterGain, delayNode, ch, Number(btn.dataset.midi), ctx.currentTime, 0.28);
          });
        });
      }

      function switchView(viewName) {
        activeView = viewName;
        document.querySelectorAll('.v-tab').forEach(t => t.classList.toggle('active', t.dataset.view === viewName));
        document.querySelectorAll('.sub-window').forEach(w => w.classList.remove('active'));
        document.getElementById(`view-${viewName}`).classList.add('active');
        if (viewName === 'pianoroll') renderPianoRoll();
        if (viewName === 'playlist') renderPlaylist();
      }

      function renderAll() {
        renderBrowser();
        renderPatternsBar();
        renderChannelRack();
        if (activeView === 'pianoroll') renderPianoRoll();
        if (activeView === 'playlist') renderPlaylist();
        renderSynthInspector();
        renderMixer();
      }

      // Live VU Meter Animation Loop
      function animateVu() {
        const masterVu = document.getElementById('masterVu');
        if (masterVu && analyser && isPlaying) {
          const data = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteFrequencyData(data);
          const avg = data.reduce((a, b) => a + b, 0) / data.length;
          masterVu.style.height = `${Math.min(100, Math.round((avg / 180) * 100))}%`;
        } else if (masterVu) {
          masterVu.style.height = '0%';
        }
        requestAnimationFrame(animateVu);
      }

      // =========================================================================
      // 7. IMPORT / EXPORT (AUDIO SAMPLES, LIBRARIES, FULL PROJECT JSON)
      // =========================================================================
      document.getElementById('importAudioBtn').addEventListener('click', () => {
        document.getElementById('audioFileInput').click();
      });

      document.getElementById('audioFileInput').addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const ctx = ensureAudio();
        const arrayBuf = await file.arrayBuffer();
        const audioBuf = await ctx.decodeAudioData(arrayBuf.slice(0));

        // Also store DataURL so project JSON export preserves imported samples
        const reader = new FileReader();
        reader.onload = () => {
          const sampleId = 'smp_' + Date.now().toString(36);
          const cleanName = file.name.replace(/\.[^/.]+$/, '').slice(0, 22);
          importedBuffers.set(sampleId, audioBuf);
          importedDataUrls.set(sampleId, reader.result);

          const sampleDef = {
            id: sampleId,
            name: cleanName,
            color: '#38bdf8',
            engine: 'sample',
            preset: 'sample',
            wave: 'sine',
            cutoff: 8000,
            attack: 0.005,
            decay: 0.3,
            sustain: 0.8,
            release: 0.1
          };
          libraries[2].items.push(sampleDef);

          // Automatically add imported sample as a new channel
          const newUid = 'ch_' + Date.now().toString(36);
          channels.push({ ...sampleDef, uid: newUid, volume: 0.9, pan: 0, muted: false });
          patterns.forEach(p => { p.data[newUid] = { steps: Array(16).fill(false), notes: [] }; });
          selectedChannelIdx = channels.length - 1;
          document.getElementById('statusBanner').textContent = `ZAIMPORTOWANO: ${cleanName}`;
          renderAll();
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      });

      document.getElementById('saveProjBtn').addEventListener('click', () => {
        const payload = {
          version: 1,
          bpm,
          masterVolume,
          masterDelayWet,
          channels,
          patterns,
          playlist,
          libraries,
          samplesBase64: Object.fromEntries(importedDataUrls.entries())
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `FruityWeb_Project_${bpm}BPM.json`;
        a.click();
        URL.revokeObjectURL(url);
        document.getElementById('statusBanner').textContent = 'PROJEKT ZAPISANY (.JSON)';
      });

      document.getElementById('exportLibBtn').addEventListener('click', () => {
        const payload = {
          type: 'FruityWeb_SoundLibrary',
          libraries,
          samplesBase64: Object.fromEntries(importedDataUrls.entries())
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'FruityWeb_SoundLibrary.json';
        a.click();
        URL.revokeObjectURL(url);
        document.getElementById('statusBanner').textContent = 'BIBLIOTEKA WYEKSPORTOWANA';
      });

      document.getElementById('importProjBtn').addEventListener('click', () => {
        document.getElementById('projFileInput').click();
      });

      document.getElementById('projFileInput').addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          const ctx = ensureAudio();

          if (data.samplesBase64) {
            for (const [id, dataUrl] of Object.entries(data.samplesBase64)) {
              const res = await fetch(dataUrl);
              const ab = await res.arrayBuffer();
              const decoded = await ctx.decodeAudioData(ab);
              importedBuffers.set(id, decoded);
              importedDataUrls.set(id, dataUrl);
            }
          }

          if (data.type === 'FruityWeb_SoundLibrary' && data.libraries) {
            libraries = data.libraries;
            document.getElementById('statusBanner').textContent = 'BIBLIOTEKA WCZYTANA!';
            renderBrowser();
          } else if (data.channels && data.patterns) {
            stopPlayback();
            bpm = data.bpm || 128;
            document.getElementById('bpmInput').value = bpm;
            masterVolume = data.masterVolume ?? 0.85;
            masterDelayWet = data.masterDelayWet ?? 0.2;
            channels = data.channels;
            patterns = data.patterns;
            playlist = data.playlist || playlist;
            if (data.libraries) libraries = data.libraries;
            activePatternIdx = 0;
            selectedChannelIdx = 0;
            document.getElementById('statusBanner').textContent = 'PROJEKT WCZYTANY!';
            renderAll();
          }
        } catch {
          document.getElementById('statusBanner').textContent = 'BŁĄD PLIKU JSON';
        }
        e.target.value = '';
      });

      // =========================================================================
      // 8. TRANSPORT & GLOBAL CONTROLS
      // =========================================================================
      document.getElementById('playBtn').addEventListener('click', () => {
        if (isPlaying) stopPlayback();
        else startPlayback();
      });
      document.getElementById('stopBtn').addEventListener('click', stopPlayback);

      document.getElementById('modePatBtn').addEventListener('click', () => {
        playMode = 'pat';
        document.getElementById('modePatBtn').classList.add('active');
        document.getElementById('modeSongBtn').classList.remove('active');
      });
      document.getElementById('modeSongBtn').addEventListener('click', () => {
        playMode = 'song';
        document.getElementById('modeSongBtn').classList.add('active');
        document.getElementById('modePatBtn').classList.remove('active');
      });

      document.getElementById('bpmInput').addEventListener('change', e => {
        bpm = Math.max(60, Math.min(220, Number(e.target.value) || 128));
        e.target.value = bpm;
        restartClockIfPlaying();
      });

      document.getElementById('addPatternBtn').addEventListener('click', () => {
        patterns.push(createBlankPattern(`Pattern ${patterns.length + 1}`));
        activePatternIdx = patterns.length - 1;
        renderAll();
      });

      document.getElementById('clearPatternBtn').addEventListener('click', () => {
        const pat = patterns[activePatternIdx];
        channels.forEach(ch => {
          pat.data[ch.uid] = { steps: Array(16).fill(false), notes: [] };
        });
        renderAll();
      });

      document.getElementById('masterDelaySlider').addEventListener('input', e => {
        masterDelayWet = Number(e.target.value);
        if (delayGain) delayGain.gain.value = masterDelayWet;
        document.getElementById('delayValLbl').textContent = `${Math.round(masterDelayWet * 100)}%`;
      });

      document.getElementById('masterVolSlider').addEventListener('input', e => {
        masterVolume = Number(e.target.value);
        if (masterGain) masterGain.gain.value = masterVolume;
        document.getElementById('masterVolLbl').textContent = `${Math.round(masterVolume * 100)}%`;
        renderMixer();
      });

      document.getElementById('exportWavBtn').addEventListener('click', exportSongToWav);
      document.getElementById('libSearch').addEventListener('input', renderBrowser);

      document.querySelectorAll('.v-tab').forEach(tab => {
        tab.addEventListener('click', () => switchView(tab.dataset.view));
      });

      window.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space') {
          e.preventDefault();
          if (isPlaying) stopPlayback();
          else startPlayback();
        }
      });

      // Boot
      renderMiniKeyboard();
      renderAll();
      requestAnimationFrame(animateVu);
    })();
  </script>
</body>
</html>
